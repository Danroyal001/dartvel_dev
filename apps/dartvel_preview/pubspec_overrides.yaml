# Local development only: Preview is built from the working tree, so it runs
# the framework the projects it opens are being written against.
dependency_overrides:
  dartvel_core:
    path: ../../packages/dartvel_core
  dartvel_shelf:
    path: ../../packages/dartvel_shelf
  dartvel_flutter:
    path: ../../packages/dartvel_flutter
  dartvel_cli:
    path: ../../packages/dartvel_cli

name: dartvel_root
publish_to: 'none'
environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"

dev_dependencies:
  lints: ^4.0.0
  test: ^1.26.3
  path: any
  http: ^1.6.0
  yaml: ^3.1.2
  dartvel_cli:
    path: packages/dartvel_cli
  dartvel_core:
    path: packages/dartvel_core
  dartvel_generator:
    path: packages/dartvel_generator

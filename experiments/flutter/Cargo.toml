# Not an upstream file: the Cargo workspace for the Rust port of the Flutter
# engine, written crate by crate beside the C++ it ports.
[workspace]
resolver = "2"
members = [
  "engine/src/flutter/fml/rust",
  "engine/src/flutter/impeller/geometry/rust",
]

[profile.release]
debug = false
# Matches the engine's -O2 C++ build: whole-program optimization, one codegen
# unit, and panics that abort as the engine builds C++ with -fno-exceptions.
# This is what makes the ported code smaller than upstream's (fml README).
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"

# For benchmarks and size comparisons (see each crate's README): whole-
# program optimization, as a C++ consumer gets for code upstream keeps in
# headers, and panics that abort, as the engine builds C++ with
# -fno-exceptions.
[profile.release-lto]
inherits = "release"
# opt-level 2 leaves impeller geometry's matrix and rect code scalar.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# One codegen unit: a smaller library than 16 units; opt-level 3, which
# vectorizes its matrix and rect code (impeller geometry README "Baseline").
[profile.release.package.impeller_geometry]
codegen-units = 1
opt-level = 3

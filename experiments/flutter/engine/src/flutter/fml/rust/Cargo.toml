# Not an upstream file: the Rust port of flutter/fml.
[package]
name = "fml"
version = "0.1.0"
edition = "2024"
publish = false
description = "A file-by-file Rust port of the Flutter engine's foundation library (flutter/fml)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "fml_dump"
path = "src/bin/fml_dump.rs"

[features]
# Upstream's FLUTTER_RELEASE (off Android and Fuchsia): trace_event's
# functions do nothing (FLUTTER_TIMELINE_ENABLED is 0).
flutter_release = []

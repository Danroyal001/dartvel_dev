[package]
name = "dartvel_shelf"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http = "1"
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
rustls = "0.23"
flate2 = "1"
parking_lot = "0.12"
crossbeam = "0.8"
ahash = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
lazy_static = "1"
http-body-util = "0.1"
tokio-stream = "0.1"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", features = ["tls12"] }

[package]
name = "dartvel_shelf_core"
version = "0.3.0"
edition = "2021"

[lib]
name = "dartvel_shelf"
crate-type = ["cdylib"]

[dependencies]
actix-web = { version = "4", features = ["http2", "rustls-0_23"] }
bytes = "1"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
num_cpus = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
futures-util = "0.3"
actix-cors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[build-dependencies]
cbindgen = "0.29"

[package]
name = "dartvel_shelf_core"
version = "0.3.0"
edition = "2021"

[lib]
name = "dartvel_shelf"
crate-type = ["cdylib"]

[dependencies]
axum = { version = "0.7", features = ["http2"] }
# tls-rustls-no-provider, not tls-rustls: the latter drags in aws-lc-rs as
# rustls's default crypto provider. We use ring, so aws-lc was compiled for
# nothing — a large C codebase that also fails on macOS, where cc-rs invokes
# clang without an -isysroot and cannot find stdlib.h.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "compression-full", "fs"] }
bytes = "1"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
num_cpus = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
futures-util = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

# Outbound HTTP client. h2 is used directly rather than through reqwest or
# hyper because ResponseFuture::poll_informational is the only place in the
# ecosystem where 103 Early Hints surface; hyper supports them in neither
# direction. See docs/http-transport.md.
h2 = "0.4"
http = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
# HTTP/3. quinn carries QUIC, h3 the HTTP semantics on top of it, h3-quinn the
# adapter between them. default-features off on quinn so it cannot pull
# aws-lc-rs back in as rustls's provider the way axum-server did — ring is what
# the rest of this crate uses and a second provider makes rustls panic rather
# than choose.
#
# h3 has no informational-response path, so 103 Early Hints do not survive an
# HTTP/3 request. That is a crate gap rather than a protocol limit, and the
# fallback to h2 is what recovers them.
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
# The client tests drive async paths directly.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

name: dartvel_shelf
description: A Fetch-style HTTP server for Dart backed by a Rust (Axum/Tokio) runtime over FFI, with routing, middleware, streaming, request limits and TLS.
version: 0.7.0
repository: https://github.com/Danroyal001/dartvel_dev
homepage: https://dartvel.dev
environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.13 is the first Dart with primary constructors, which every
  # scaffold, sample and generated data model is written with.
  sdk: ">=3.13.0 <4.0.0"

# Declared, because pub.dev infers platforms from imports and follows
# ones that only run on their own platform (see
# tool/pubspec_platforms_check.dart).
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  # The wire types live in dartvel_core, which is on both sides of the
  # wire. This package is the server half and depends on them.
  dartvel_core: ^0.6.0
  meta: ^1.12.0
  ffi: ^2.1.0
  hooks: ^0.20.1
  code_assets: ^0.19.7
  path: ^1.9.0
  image: ^4.9.2
  crypto: ^3.0.7

dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  ffigen: ">=12.0.0 <21.0.0"
  test: ^1.25.0

name: DartvelShelfBindings
description: "FFI bindings for dartvel_shelf"
output: lib/src/ffi/bindings.dart
headers:
  entry-points:
    - rust/include/dartvel_shelf.h
  include-directives:
    - 'rust/include/dartvel_shelf.h'
preamble: |
  // DO NOT EDIT. Generated by ffigen.
  // Run: dart run ffigen

# Generate only what we need to avoid system-header noise/warnings.
exclude-all-by-default: true
functions:
  include:
    - dv_last_error
    - dv_server_bootstrap
    - dv_server_poll_job
    - dv_server_submit_response
    - dv_request_metadata_read
    - dv_response_write_chunk
    - dv_response_open_stream
    - dv_response_finalize_stream
    - dv_response_write_for_request
    - dv_ws_send_text
    - dv_ws_send_bin
    - dv_ws_close
structs:
  include:
    - SliceU8
    - RequestEnvelope
    - ResponseEnvelope
enums:
  include: []
typedefs:
  include: []
macros:
  include: []

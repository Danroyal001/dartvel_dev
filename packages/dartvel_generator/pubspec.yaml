name: dartvel_generator
description: Compile-time generators for readable Dartvel routing and model glue.
version: 1.0.0
repository: https://github.com/Danroyal001/dartvel_dev
homepage: https://dartvel.dev


environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"

# Add regular dependencies here.
dependencies:
  build: ^4.0.0
  source_gen: ^4.1.1
  analyzer: ^10.0.1
  code_builder: ^4.10.0
  dart_style: ^3.1.1
  glob: ^2.1.2
  yaml: ^3.1.2
  path: ^1.9.0
  dartvel_core:
    path: ../dartvel_core

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.2
  build_runner: ^2.10.4
  source_gen_test: ^1.3.0

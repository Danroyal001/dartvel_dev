name: dartvel_dev
description: >-
  Dartvel: a batteries-included, AI-native full-stack application platform
  built around Flutter. Pages, models, backend functions, UI and business
  logic; everything else is generated, compiled or served.
version: 0.2.1
repository: https://github.com/Danroyal001/dartvel_dev
homepage: https://dartvel.dev

environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dartvel_core:
    version: ^0.2.1
  dartvel_flutter:
    version: ^0.2.1
  dartvel_shelf:
    version: ^0.3.0
  dartvel_cli:
    version: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter


name: dartvel_core
publish_to: 'none'
description: Core helpers (Res), types, simple CORS hint for dartvel backend
version: 0.2.1
environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"
dependencies:
  dartvel_shelf:
    path: ../dartvel_shelf
  async: ^2.13.1
  crypto: ^3.0.7
  http: ^1.6.0
  # The native HTTP/2 client is reached through FFI; the library itself is
  # packaged by dartvel_shelf, which this already depends on.
  ffi: ^2.1.0
  mime: ^1.0.4
  http_parser: ^4.0.2
  shelf_multipart: ^1.0.0
  sqlite3: ^2.9.4
  drift: ^2.14.0
  pointycastle: ^4.0.0
dev_dependencies:
  test: ^1.28.0
  build_runner: ^2.4.0
  drift_dev: ^2.14.0

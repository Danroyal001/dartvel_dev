
name: dartvel_core
description: Core helpers (Res), types, simple CORS hint for dartvel backend
version: 0.3.1
repository: https://github.com/Danroyal001/dartvel_dev
homepage: https://dartvel.dev
environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"
dependencies:
  async: ^2.13.1
  crypto: ^3.0.7
  http: ^1.6.0
  # The native HTTP/2 client is reached through FFI. The library is built from
  # this package's own rust/ crate now: it used to be packaged by
  # dartvel_shelf, which meant a frontend acquired a server to get a client.
  ffi: ^2.1.0
  mime: ^1.0.4
  http_parser: ^4.0.2
  shelf_multipart: ^1.0.0
  sqlite3: ^2.9.4
  drift: ^2.14.0
  pointycastle: ^4.0.0
  # SAML assertions are XML, and their signatures are over canonical XML.
  xml: ^6.5.0
  # The native-asset build hook that compiles this package's rust/ crate.
  # They belong in dependencies rather than dev_dependencies: the hook runs
  # for anything that depends on this package, not only when testing it.
  hooks: ^0.20.1
  code_assets: ^0.19.7

dev_dependencies:
  test: ^1.28.0
  build_runner: ^2.4.0
  drift_dev: ^2.14.0

# AWS's own SigV4 documentation test vectors, not a credential. The pair
# AKIDEXAMPLE / wJalrXUtnFEMI...EXAMPLEKEY is what AWS publishes for verifying
# a signing implementation, and the signature this suite asserts is only
# reproducible with them.
false_secrets:
  - /test/aws_sigv4_test.dart
  - /test/file_storage_test.dart
  - /test/mail_providers_test.dart

name: dartvel
publish_to: 'none'
description: Umbrella package for the Dartvel full-stack Flutter platform.
version: 0.2.1

environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dartvel_core:
    path: ../dartvel_core
  dartvel_flutter:
    path: ../dartvel_flutter
  dartvel_shelf:
    path: ../dartvel_shelf
  dartvel_cli:
    path: ../dartvel_cli

dev_dependencies:
  flutter_test:
    sdk: flutter

# jnigen configuration for the Android framework classes Dartvel binds.
#
# Generated rather than hand-written, because hand-written JNI is not supported:
# calling a Java method through package:jni needs ProtectedJniExtensions, which
# is hidden from the public export and exposed only through
# package:jni/_internal.dart — a library whose own header says it is "meant for
# use by generated code only". An earlier hand-written attempt was removed for
# exactly this reason.
#
# Generation needs android.jar from the Android SDK, so it runs on a runner
# rather than here, and the output is committed. See
# .github/workflows/android-bindings.yml.

summarizer:
  backend: asm

# The platform jar, by explicit classpath rather than through
# android_sdk_config.
#
# That block appends a trailing slash to the jar path — it passed
# `-c ".../android.jar/"` to the summarizer, which then reported every class as
# "Not found" because a jar with a slash after it is a directory that does not
# exist. The error named the classes rather than the path, so the cause was
# only visible in the command it echoed.
#
# ANDROID_JAR_PATH is substituted by .github/workflows/android-bindings.yml,
# because the SDK location differs between runner images.
# The key is class_path. `classpath` is silently ignored — jnigen parses the
# file, finds no such field, passes no -c to the summarizer, and reports every
# class as "Not found". Nothing says the field name was wrong.
class_path:
  - ANDROID_JAR_PATH

output:
  dart:
    # Relative to this file, which lives in tool/ — hence the climb out. A
    # plain lib/... resolved to tool/lib/..., and jnigen reported success
    # having written the bindings somewhere nothing imports from.
    path: ../lib/src/platform/android/generated/
    structure: package_structure

classes:
  # No ActivityThread here, and the reason is worth keeping.
  #
  # ActivityThread.currentApplication() was the intended way to a Context with
  # no Activity, and generation proved it cannot be: the class is hidden and is
  # not in the public android.jar stub. jnigen found the other six and reported
  # "Not found: [android.app.ActivityThread]".
  #
  # It turned out not to be needed. package:jni exports
  # `GetApplicationContext()` from its own C header, documented as "Returns
  # application context on Android" — a deliberate C API, reachable with plain
  # dart:ffi, and neither a hidden Android class nor a Dart internal. That is
  # what the Dart side uses.

  # Clipboard.
  - android.content.ClipboardManager
  # ClipData pulls ClipData$Item with it. Listing a nested class separately is
  # rejected: "Nested classes cannot be specified separately."
  - android.content.ClipData
  - android.content.Context

  # Sharing. Intent.ACTION_SEND through Intent.createChooser, started on the
  # application Context with FLAG_ACTIVITY_NEW_TASK -- no Activity required.
  - android.content.Intent

  # Kiosk. Lock task mode is an Activity's, and an Activity is what a JNI
  # binding cannot reach from the application Context that package:jni's
  # GetApplicationContext() hands back.
  #
  # Application.registerActivityLifecycleCallbacks is the public way to it:
  # the callback is a Java interface, jnigen generates an `implement` for it,
  # and package:jni builds the proxy. So the running Activity arrives at Dart
  # without a platform channel, which is what the native integration rule
  # asks for and what stopped this being built until now.
  #
  # ActivityLifecycleCallbacks is nested inside Application and comes with
  # it. Listing a nested class separately is rejected.
  - android.app.Activity
  - android.app.Application

  # Immersive mode: the other half of a kiosk. Lock task blocks the buttons;
  # this hides the bars they are drawn on.
  - android.view.View
  - android.view.Window

  # Haptics. VibratorManager is the API 31 way in; Vibrator remains for older.
  - android.os.Vibrator
  - android.os.VibratorManager
  - android.os.VibrationEffect

exclude:
  methods:
    # Deprecated overloads that generate ambiguous Dart names and that nothing
    # here calls.
    - class: android.os.Vibrator
      method: vibrate
      descriptor: (J)V

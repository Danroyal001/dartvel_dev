name: dartvel_flutter_example
description: >-
  The parts of dartvel_flutter that work without Dartvel's code generator:
  DVBox, DVText, the DVModifier chain, signals and DV.global.
publish_to: none
version: 0.0.1

environment:
  # One floor for every Dartvel package; see the root pubspec.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dartvel_flutter:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  uses-material-design: true

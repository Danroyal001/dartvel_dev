# Tags this package's suites use.
#
# Declared so `--tags` and `--exclude-tags` are checked against something
# rather than silently matching nothing: a misspelled tag on the command line
# would otherwise run no tests and report success.
tags:
  panels:
    # AppKit's open and save panels, which are served by another process. On
    # a runner without a full window server session that process sometimes
    # takes the tester with it, so these run as their own step: a death there
    # must not throw away the results of everything else in the suite.

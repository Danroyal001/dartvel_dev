name: dartvel_flutter
description: Flutter helpers for dartvel pages (SEO + transitions + route state)
version: 0.3.0
repository: https://github.com/Danroyal001/dartvel_dev
homepage: https://dartvel.dev
environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # For the path URL strategy. Reached only through a conditional import, so
  # no non-web target pulls it in.
  flutter_web_plugins:
    sdk: flutter
  go_router: ^14.2.0
  web: ^1.0.0
  seo: ^0.0.10
  # Upstream mix from pub.dev, at the version dartvel_mix tracks.
  #
  # The fork was depended on by git for its SDK floor, and that reasoning was
  # backwards: a dependency declaring a *lower* floor cannot lower Dartvel's,
  # which is whatever Dartvel itself declares. Upstream publishes this exact
  # version, and pub refuses a git dependency in a published package.
  #
  # dartvel_mix still matters, for the reason it was forked: it is a drop-in
  # replacement still named `mix`, so a project migrating to Dartvel swaps the
  # dependency and keeps working. That is a migration path, not something this
  # package needs to build.
  mix: ^2.2.0-beta.5
  flutter_riverpod: ^2.5.1
  ffi: ^2.1.0
  # For @useResult on DV.Navigation.to, which returns a callback that is
  # useless if dropped.
  meta: ^1.15.0
  dartvel_core:
    version: ^0.2.1
  jni: ^1.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  jnigen: ^0.17.0

flutter:
  uses-material-design: true

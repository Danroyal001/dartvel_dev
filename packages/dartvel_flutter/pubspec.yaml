name: dartvel_flutter
description: Flutter helpers for dartvel pages (SEO + transitions + route state)
version: 0.2.1
publish_to: none
environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  web: ^1.0.0
  seo: ^0.0.10
  # The Dartvel fork, not pub's mix. mix's SDK constraint sets Dartvel's own
  # floor — it is the styling layer under DVBox and DVText — so it has to move
  # with Dartvel rather than with upstream's oldest supported Dart.
  mix:
    git:
      url: https://github.com/Danroyal001/dartvel_mix.git
      path: packages/mix
  flutter_riverpod: ^2.5.1
  ffi: ^2.1.0
  dartvel_core:
    path: ../dartvel_core
  jni: ^1.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  jnigen: ^0.17.0

flutter:
  uses-material-design: true

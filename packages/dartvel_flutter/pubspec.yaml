name: dartvel_flutter
description: Flutter helpers for dartvel pages (SEO + transitions + route state)
version: 0.2.1
publish_to: none
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  web: ^1.0.0
  seo: ^0.0.10
  mix: ^2.0.0
  flutter_riverpod: ^2.5.1
  ffi: ^2.1.0
  dartvel_core:
    path: ../dartvel_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

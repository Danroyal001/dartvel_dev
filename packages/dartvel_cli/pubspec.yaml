
name: dartvel_cli
description: CLI for dartvel v0.1 (routes + web client + backend configs)
version: 0.6.0
repository: https://github.com/Danroyal001/dartvel_dev
homepage: https://dartvel.dev
environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.13 is the first Dart with primary constructors, which every
  # scaffold, sample and generated data model is written with.
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  yaml: ^3.1.2
  path: ^1.9.0
  glob: ^2.1.2
  io: ^1.0.4
  args: ^2.5.0
  file: ^7.0.0
  watcher: ^1.1.0
  puppeteer: ^3.0.0
  dartvel_core:
    version: ^0.6.0
  dartvel_shelf:
    version: ^0.7.0
  crypto: ^3.0.7
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  image: ^4.9.2
  # Module trust: verifying a publisher's ES256 signature over a module
  # package. dartvel_core signs with it and exports no verifier.
  pointycastle: ^4.0.0
  # Module trust compares a resolved version against its pin, where a
  # prerelease of the pinned version is older and not the same. Also used by
  # release_constraints_test. Declared rather than relied on as a transitive
  # dependency: pub warns on the undeclared import.
  pub_semver: ^2.1.0
dev_dependencies:
  lints: ^4.0.0
  # Used by semantics_capture_server_test to make real requests against the
  # capture's own handler. Declared rather than leaned on transitively, for
  # the same reason as pub_semver above.
  http: ^1.2.0
  test: ^1.25.0
executables:
  dartvel: dartvel

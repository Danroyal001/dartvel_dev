
name: dartvel_cli
description: CLI for dartvel v0.1 (routes + web client + backend configs)
version: 0.3.2
repository: https://github.com/Danroyal001/dartvel_dev
homepage: https://dartvel.dev
environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"
dependencies:
  yaml: ^3.1.2
  path: ^1.9.0
  glob: ^2.1.2
  io: ^1.0.4
  args: ^2.5.0
  file: ^7.0.0
  watcher: ^1.1.0
  build: ^4.0.0
  puppeteer: ^3.0.0
  dartvel_core:
    version: ^0.3.2
  dartvel_shelf:
    version: ^0.4.2
  crypto: ^3.0.7
  shelf: ^1.4.2
  shelf_static: ^1.1.3
dev_dependencies:
  lints: ^4.0.0
  # Used by release_constraints_test to compare a sibling's version against
  # the constraint declared on it. Declared rather than relied on as a
  # transitive dependency: pub warns on the undeclared import, which is the
  # same class of mistake the test itself exists to catch.
  pub_semver: ^2.1.0
  # Used by semantics_capture_server_test to make real requests against the
  # capture's own handler. Declared rather than leaned on transitively, for
  # the same reason as pub_semver above.
  http: ^1.2.0
  test: ^1.25.0  # Downgraded for analyzer compatibility with build package
executables:
  dartvel: dartvel

name: dartvel_documents
description: PDFs and presentations in Dartvel apps, rendered by a bundled PDFium.
version: 0.1.0
repository: https://github.com/Danroyal001/dartvel_dev
homepage: https://dartvel.dev
publish_to: none
environment:
  # One floor for every Dartvel package, deliberately.
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^2.0.0
  crypto: ^3.0.7
  ffi: ^2.1.0
  hooks: ^2.0.0

dev_dependencies:
  test: any
  flutter_test:
    sdk: flutter

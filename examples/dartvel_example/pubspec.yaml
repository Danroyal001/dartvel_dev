
name: dartvel_example
description: Example app using dartvel v0.1
version: 0.0.2
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  path: ^1.9.0
  shelf: ^1.4.1
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dartvel_core:
    path: ../../packages/dartvel_core
  dartvel_shelf:
    path: ../../packages/dartvel_shelf
  dartvel_flutter:
    path: ../../packages/dartvel_flutter
  mime: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  lints: ^4.0.0
  dartvel_cli:
    path: ../../packages/dartvel_cli
  args: ^2.5.0
  glob: ^2.1.2
  file: ^7.0.0
  watcher: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/

dartvel:
  backendHost: 0.0.0.0
  backendPort: 3000
  devBackendHost: http://localhost:3000
  prodBackendHost: https://api.example.com

  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [ .env, .env.local ]
  plugins: []
  webPrerender: false
  ota: false

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  routingRedirects:
    - { from: "/old", to: "/" }
    - { from: "/post/:id", to: "/blog/:id" }
  routingNormalizeTrailingSlash: true
  notFoundRedirect: /

  i18n:
    strategy: query
    param: lang
    defaultLocale: en-US
    locales: [en-US, fr-FR]

  webSeoDefaults:
    siteName: Dartvel Demo
    defaultTitle: Dartvel Demo
    defaultDescription: A demo of dartvel pages with SEO + transitions.
    defaultImage: assets/og_default.png
    twitterHandle: "@dartvel_demo"


name: dartvel_example
description: Oakline Coffee, a small coffee shop built with Dartvel.
version: 0.0.2
publish_to: "none"

environment:
  # One floor for every Dartvel package, deliberately.
  # Two floors that disagreed is what recorded webOS as merely
  # unproven when its Dart could not resolve dependencies at all:
  # the lower number was the one that got reasoned from.
  # 3.12 is what dartvel_mix pins; 3.9 is only what code_assets needs.
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  path: ^1.9.0
  shelf: ^1.4.1
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dartvel_core:
    path: ../../packages/dartvel_core
  dartvel_shelf:
    path: ../../packages/dartvel_shelf
  # The module this application mounts. A mounted module is a package like
  # any other; the mount point is the parent's business, declared below.
  dartvel_example_notes:
    path: modules/notes
  dartvel_flutter:
    path: ../../packages/dartvel_flutter
  mime: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the application rather than a widget in isolation. `dartvel test e2e`
  # already looks for integration_test/; nothing used it until now.
  integration_test:
    sdk: flutter
  lints: ^4.0.0
  dartvel_cli:
    path: ../../packages/dartvel_cli
  args: ^2.5.0
  glob: ^2.1.2
  file: ^7.0.0
  watcher: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/

dartvel:
  android:
    # What the Android build declares in the manifest. Declared rather than
    # inferred: what an application asks for at run time cannot be read off
    # its source, and a framework that declared everything it can request
    # would put "reads your contacts" on the store listing of a torch.
    #
    # A permission requested at run time and missing here is refused by
    # Android instantly, with no dialog and the same answer a person tapping
    # Deny gives -- so the emulator job asserts that camera below reaches the
    # installed APK.
    permissions: [camera, location, contacts]

  search:
    synonyms:
      admin: [administrator, superuser]
    typoTolerance: true
    highlightPre: "<mark>"
    highlightPost: "</mark>"
  # App Links and Universal Links. The build writes both verification
  # documents under build/web/.well-known from the route index, puts the
  # intent filter in the Android manifest and the applinks: domains in the
  # iOS entitlements; `dartvel doctor --target android,ios` checks what the
  # domain really serves. The identifiers here are the example's own, and the
  # fingerprint is a placeholder: a real one is keytool's SHA256 line for the
  # release key, or the Play signing certificate with playAppSigning.
  deepLinks:
    domains: [example.dartvel.dev]
    android:
      package: com.example.dartvel_example
      fingerprints:
        - "14:6D:E9:83:C5:73:06:50:D8:EE:B9:95:2F:34:FC:64:16:A0:83:42:E6:1D:BE:A8:8A:04:96:B2:3F:CF:44:E5"
    ios:
      appId: ABCDE12345.com.example.dartvelExample
    exclude: [/admin/**]
  backendHost: 0.0.0.0
  backendPort: 3000
  devBackendHost: http://localhost:3000
  prodBackendHost: https://api.example.com

  # The currency every @DVModel(nativePrice:) is in. One per project: a
  # catalogue priced in three currencies is three numbers nobody can add
  # together.
  nativeCurrency: USD

  # Decided once, where the server starts, which is why declaring either
  # as a route middleware is refused. Here so the generated backend
  # emits a real policy and a compiler reads it: an empty section would
  # emit null and prove nothing.
  server:
    cors:
      origins: [https://app.example.com]
      methods: [GET, POST]
      allowCredentials: true
      maxAge: 10m
    compression: true

  # A module mounted at /notes: its own /:id answers at /notes/:id here, and
  # its pages are in this application's route index and sitemap.
  modules:
    notes:
      source:
        path: modules/notes
      mount: /notes
      deployment: embedded
      # Schema-isolated: the module's tables are in this application's
      # database under the module's own name. Its models resolve the name
      # at run time and dartvel db migrate creates it, and the point of
      # declaring it here is that the two have to agree.
      data: schema-isolated

  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [ .env, .env.local ]
  plugins: []
  webPrerender: false
  ota: false

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  routingRedirects:
    - { from: "/old", to: "/" }
    - { from: "/post/:id", to: "/blog/:id" }
  routingNormalizeTrailingSlash: true
  notFoundRedirect: /

  i18n:
    strategy: query
    param: lang
    defaultLocale: en-US
    locales: [en-US, fr-FR]

  webSeoDefaults:
    siteName: Oakline Coffee
    defaultTitle: Oakline Coffee
    defaultDescription: Small-batch coffee, roasted on Tuesday and at your door by Friday. A Dartvel demo.
    defaultImage: assets/og_default.png
    twitterHandle: "@dartvel_demo"

# This application serves a Dartvel backend, so it asks for the native server
# to be built into it. Without this the hook skips the Rust build and
# dartvel_shelf's serve() has no library to open -- which is the point: an
# application that only calls a remote API should not ship an HTTP server.
hooks:
  user_defines:
    dartvel_shelf:
      embed_server: true

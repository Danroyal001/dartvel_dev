name: dartvel_site
description: The dartvel.dev site, built with Dartvel.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  dartvel_core: ^0.2.1
  dartvel_shelf: ^0.3.0
  dartvel_flutter: ^0.2.1
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.5.4
  lints: ^4.0.0
  dartvel_cli: ^0.2.1


flutter:
  uses-material-design: true
  assets:
    - assets/

dartvel:
  backendHost: 0.0.0.0
  backendPort: 3000
  devBackendHost: http://localhost:3000
  prodBackendHost: https://api.dartvel-site.com
  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [.env, .env.local]
  plugins: []
  webPrerender: false
  ota: false

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  seo:
    siteName: dartvel site
    defaultTitle: Welcome
    defaultDescription: A Dartvel application
  pwa:
    enabled: true
    name: Dartvel
    shortName: Dartvel
    description: Flutter, full stack.
    themeColor: "#2F6BFF"
    backgroundColor: "#FFFFFF"

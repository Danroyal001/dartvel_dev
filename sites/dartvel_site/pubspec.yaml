name: dartvel_site
description: The dartvel.dev site, built with Dartvel.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  dartvel_core: ^0.2.1
  dartvel_shelf: ^0.3.0
  dartvel_flutter: ^0.2.1
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the tests above on the device rather than in a fake tree, which is
  # the only place a link is really a link.
  integration_test:
    sdk: flutter
  build_runner: ^2.5.4
  lints: ^4.0.0
  dartvel_cli: ^0.2.1


flutter:
  # Bundled rather than named. Flutter web cannot resolve the generic
  # "monospace" family -- it falls back to the body font -- so a developer
  # site rendered every Dart sample in proportional text.
  fonts:
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono.ttf
  uses-material-design: true

dartvel:
  backendHost: 0.0.0.0
  backendPort: 3000
  devBackendHost: http://localhost:3000
  prodBackendHost: https://api.dartvel-site.com
  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [.env, .env.local]
  plugins: []
  webPrerender: false
  ota: false

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  seo:
    title: "Dartvel — Flutter, full stack"
    description: >-
      Write pages, models, backend functions, UI and business logic. Routing,
      clients, serialization, forms, admin and the server are generated,
      compiled or served.
    siteUrl: https://dartvel.dev
    siteName: Dartvel
    image: icons/Icon-512.png

  pwa:
    enabled: true
    name: Dartvel
    shortName: Dartvel
    description: Flutter, full stack.
    themeColor: "#2F6BFF"
    backgroundColor: "#FFFFFF"

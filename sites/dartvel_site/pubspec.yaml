name: dartvel_site
description: The dartvel.dev site, built with Dartvel.
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  dio: ^5.5.0
  dartvel_core: ^0.6.0
  dartvel_shelf: ^0.7.0
  dartvel_flutter: ^0.6.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs the tests above on the device rather than in a fake tree, which is
  # the only place a link is really a link.
  integration_test:
    sdk: flutter
  lints: ^4.0.0
  dartvel_cli: ^0.6.0
  # Read by the typeface test, which checks that every font family the site
  # names is declared under flutter.fonts with a file that exists.
  yaml: ^3.1.2
  # The CLI reference is generated from the command table; see
  # tool/cli_reference.dart.
  args: ^2.5.0


flutter:
  # Bundled rather than named, for two reasons. Flutter web cannot resolve
  # the generic "monospace" family: it falls back to the body font, and a
  # developer site rendered every Dart sample in proportional text. And a
  # font fetched from Google at run time is a third-party request on a site
  # that ships as a zip to somebody's shared host, where it would be a flash
  # of unstyled text and one more thing that can be offline.
  #
  # Both are variable fonts with a wght axis, so one file covers every weight
  # the site uses. Manrope is geometric and open: it holds up at 50 points in
  # the headline and stays legible at 13 in a label, which is the range this
  # site actually spans. JetBrains Mono is drawn for reading code, which is
  # what half of these pages are. Neither is a default, and that is the
  # point: Roboto is what a Flutter site renders in when nobody chose.
  fonts:
    - family: Manrope
      fonts:
        - asset: fonts/Manrope.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono.ttf
  uses-material-design: true
  # Screenshots of the real Studio, shown on /studio and the home page.
  assets:
    - assets/studio/
    - assets/studio/sections/
    # The film-grain tile the hero band is textured with. Written by
    # tool/grain.dart, deterministically, so the file here can be reproduced.
    - assets/texture/

dartvel:
  backendHost: 0.0.0.0
  backendPort: 3000
  devBackendHost: http://localhost:3000
  prodBackendHost: https://api.dartvel-site.com
  pagesDir: lib/pages
  backendDir: lib/backend
  apiBasePath: /api
  envFiles: [.env, .env.local]
  plugins: []
  webPrerender: false
  ota: false

  # A static site with no sign-in: no /login, /sign-up or /account pages.
  auth:
    pages: false

  transitions:
    default: fade
    durationMs: 200
    curve: easeInOut

  seo:
    title: "Dartvel: a Flutter app and its backend in one Dart project"
    description: >-
      Annotate a class and a function. Dartvel generates the routes, forms,
      typed client and API server for your Flutter app.
    siteUrl: https://dartvel.dev
    siteName: Dartvel

    # What a page that says nothing about itself gets, and what is left
    # out entirely. A page overrides these field by field, so /features
    # keeps its own priority and its own frequency.
    sitemap:
      enabled: true
      exclude: [/__admin/**]
      defaults:
        priority: 0.5
        changeFrequency: monthly
    # A landscape card, not the app icon. A square 512 is what a link
    # preview crops to a thumbnail; 1200 by 630 is the size every one of
    # them actually lays out for.
    image: social-card.png

  pwa:
    enabled: true
    name: Dartvel
    shortName: Dartvel
    description: A Flutter app and its backend in one Dart project.
    themeColor: "#2F6BFF"
    backgroundColor: "#FFFFFF"

  # The launch splash takes its light colour from pwa.backgroundColor. The
  # dark one is the dark palette's page, so a phone in dark mode does not open
  # on a white screen before a dark site.
  splash:
    darkColor: "#0A0D13"

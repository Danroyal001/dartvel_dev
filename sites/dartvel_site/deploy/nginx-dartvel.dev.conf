# dartvel.dev, served by the Dartvel web-server binary (systemd unit
# dartvel-site on 127.0.0.1:8740). The static bundle this replaced is still
# at /var/www/dartvel.dev; rollback:
#   sudo ln -sfn /etc/nginx/sites-available/dartvel.dev.static.conf /etc/nginx/sites-enabled/dartvel.dev.conf && sudo nginx -t && sudo systemctl reload nginx
upstream dartvel_site {
    server 127.0.0.1:8740;
    keepalive 16;
}

map $http_upgrade $dartvel_site_connection {
    default upgrade;
    ''      '';
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/dartvel.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dartvel.dev/privkey.pem; # managed by Certbot
    server_name dartvel.dev www.dartvel.dev;
    access_log /var/log/nginx/dartvel.dev.access.log;
    error_log /var/log/nginx/dartvel.dev.error.log;
    include snippets/site-common.conf;

    # Studio uploads (images for the page builder, imports).
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dartvel_site_connection;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://dartvel_site;
    }

    # Nobody signs up on dartvel.dev: the one account is the owner's, made on
    # the server. The endpoint stays on the binary for localhost only.
    location = /api/auth/sign-up { return 404; }

    # Flutter web names its files without a content hash, so nothing here is
    # immutable: a year-long cache would keep showing a replaced screenshot.
    # The engine (canvaskit) changes only with a Flutter upgrade; assets change
    # with a deploy.
    location ~ ^/canvaskit/ {
        proxy_pass http://dartvel_site;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location ~ ^/assets/.*\.(js|wasm|woff2|otf|ttf|png|jpg|jpeg|webp|svg|json)$ {
        proxy_pass http://dartvel_site;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location ~ ^/(index\.html|main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        proxy_pass http://dartvel_site;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.zip$ { deny all; }
}
server {
    if ($host = www.dartvel.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = dartvel.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name dartvel.dev www.dartvel.dev;
    return 404; # managed by Certbot
}

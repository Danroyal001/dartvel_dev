name: Flutter engine build

# Builds the Flutter engine from source, for the modes Google does not publish
# as a standalone custom-embedder artifact.
#
# Why this is needed, precisely — because the obvious assumption is wrong and
# cost real time already: Google publishes exactly one standalone
# `libflutter_engine.so` per engine revision, at `linux-{arch}/linux-{arch}-
# embedder.zip`, and it is the **release** build (41.7 MB, matching Sony's
# 42.6 MB release engine; their debug is 381 MB and profile 52.5 MB). The
# per-mode directories publish `linux-{arch}-flutter-gtk.zip`, where the engine
# is statically linked into the GTK embedder and cannot be reused.
#
# So release-mode embedder targets need no engine build, and debug and profile
# do. This builds those.
#
# Runs on a GitHub runner because the checkout alone is tens of gigabytes,
# which is more disk than the development Codespace has. The output is split
# into chunks small enough to commit, so it can travel back without Git LFS.

on:
  workflow_dispatch:
    inputs:
      flutter_ref:
        description: Flutter tag or commit to build the engine from
        required: false
        default: "3.44.5"
      mode:
        description: Runtime mode
        required: false
        default: profile
        type: choice
        options: [debug, profile, release]
      arch:
        description: Target CPU
        required: false
        default: x64
        type: choice
        # arm is 32-bit, and it is here for webOS. Google publishes
        # linux-arm64 and linux-x64 embedder engines and no 32-bit arm one, and
        # webOS televisions run a 32-bit ARM userland — which is the whole
        # reason that target has no engine to link against.
        options: [x64, arm64, arm]

jobs:
  engine:
    name: engine ${{ inputs.mode }} ${{ inputs.arch }}
    runs-on: ubuntu-latest
    # The sync is the long pole and the build is not short. Six hours is the
    # ceiling GitHub allows; a job that reaches it has not "nearly finished".
    timeout-minutes: 350
    steps:
      # A stock runner does not have room for the engine checkout. This is not
      # optimisation — without it the sync fails partway with a disk error that
      # reads like a network fault.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: dartvel

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 ninja-build pkg-config \
            libgtk-3-dev git curl unzip

      - name: Fetch depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      # Settled by reading the repository rather than guessing a fourth time.
      #
      # flutter/flutter contains BOTH engine/src/build and engine/src/flutter,
      # and DEPS at its root uses paths relative to the gclient root. Those two
      # facts together mean the repository root *is* the gclient root: there is
      # no subdirectory arrangement that satisfies both.
      #
      # So the checkout is made first and gclient is pointed at it with a
      # self-referential solution — `managed: False` and no url, which is how
      # gclient is run inside an existing checkout. The three earlier attempts
      # each put the root one level away from the repository and failed on the
      # same sysroot hook, first with a doubled path and then with a path that
      # was correct and empty.
      - name: Sync engine sources
        id: sync
        run: |
          set -euo pipefail
          mkdir -p engine-root && cd engine-root
          git init -q
          git remote add origin https://github.com/flutter/flutter.git
          git fetch --depth 1 origin "${{ inputs.flutter_ref }}"
          git checkout -q FETCH_HEAD
          # Present before the hooks run, which is the thing that was missing.
          test -f engine/src/build/linux/sysroot_scripts/install-sysroot.py
          cat > .gclient <<'EOF'
          solutions = [
            {
              "managed": False,
              "name": ".",
              "url": None,
              "deps_file": "DEPS",
              "custom_vars": {
                "download_android_deps": False,
                "download_fuchsia_deps": False,
              },
            },
          ]
          EOF
          gclient sync --no-history --shallow -j$(nproc) 2>&1 | tail -30
          df -h /
          test -d engine/src/third_party

      # The CLI holds the architecture mapping, so the run and the test
      # suite read the same source. It used to live in a shell expression
      # here that put the requested architecture in the artifact filename and
      # ignored it everywhere else, so a request for 32-bit ARM built x86-64,
      # uploaded it as `engine-arm-release`, and reported success.
      - name: Resolve the build
        id: plan
        run: |
          set -euo pipefail
          dart pub get --directory dartvel/packages/dartvel_cli
          SRC="$GITHUB_WORKSPACE/engine-root/engine/src"
          dart run dartvel/packages/dartvel_cli/bin/dartvel.dart engine plan \
            --arch "${{ inputs.arch }}" --mode "${{ inputs.mode }}" \
            --src-root "$SRC"
          dart run dartvel/packages/dartvel_cli/bin/dartvel.dart engine plan \
            --arch "${{ inputs.arch }}" --mode "${{ inputs.mode }}" \
            --src-root "$SRC" \
            --github-output >> "$GITHUB_OUTPUT"

      # A cross build needs the target's sysroot, and the gclient hooks fetch
      # only the host's. Without this the build fails deep in a link step with
      # a missing libc rather than at configure time.
      - name: Install the target sysroot
        if: steps.plan.outputs.sysroot-arch != ''
        run: |
          set -euo pipefail
          cd engine-root/engine/src
          python3 build/linux/sysroot_scripts/install-sysroot.py \
            --arch="${{ steps.plan.outputs.sysroot-arch }}"

      # build/toolchain/custom looks for ${triple}-ar, -readelf, -nm and
      # -strip beside clang. The engine ships them as llvm-ar and friends,
      # which are target-agnostic, so these are links rather than a download.
      #
      # They go into the engine's own clang directory rather than a directory
      # of their own: clang finds its resource headers relative to argv[0] and
      # the build passes -no-canonical-prefixes, so a symlink farm elsewhere
      # leaves it unable to find stddef.h.
      - name: Add the triple-prefixed binutils
        if: steps.plan.outputs.toolchain-links != ''
        run: |
          set -euo pipefail
          TC="${{ steps.plan.outputs.toolchain-root }}"
          test -x "$TC/bin/clang"
          for pair in ${{ steps.plan.outputs.toolchain-links }}; do
            ln -sf "$TC/bin/${pair#*:}" "$TC/bin/${pair%%:*}"
          done
          "$TC/bin/${{ steps.plan.outputs.target-triple }}-ar" --version | head -1

      # build/toolchain/custom expects a complete cross toolchain, one that
      # ships the target's runtime libraries the way a vendor's does. The
      # engine's bundled clang is a host toolchain with a sysroot beside it,
      # and Google builds no arm-unknown-linux-gnueabihf runtime because
      # 32-bit ARM Linux is not an engine target. Without this the build
      # compiles all 7060 targets and fails at the first link on a missing
      # libclang_rt.builtins.a.
      #
      # libgcc implements the same __aeabi_* helpers -- the substitution
      # --rtlib=libgcc makes -- and Ubuntu ships an armhf one in the ordinary
      # x86-64 archive as part of the cross compiler, so there are no
      # multiarch sources to add. libc++ and libunwind come from the engine's
      # own sources instead, via use_custom_libcxx.
      - name: Provide the target compiler builtins
        if: steps.plan.outputs.builtins-package != ''
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq "${{ steps.plan.outputs.builtins-package }}"
          TC="${{ steps.plan.outputs.toolchain-root }}"
          RESOURCE=$("$TC/bin/clang" -print-resource-dir)
          DEST="$RESOURCE/lib/${{ steps.plan.outputs.builtins-subdir }}"
          mkdir -p "$DEST"
          LIBGCC=$(find /usr/lib/gcc-cross/arm-linux-gnueabihf -name libgcc.a | head -1)
          test -n "$LIBGCC"
          cp "$LIBGCC" "$DEST/${{ steps.plan.outputs.builtins-file }}"
          ls -l "$DEST"

      # Not continue-on-error. A build that fails should fail the job: the
      # step after it only checks the file is non-empty, which a stale output
      # directory from a previous configure can satisfy.
      - name: Build the engine
        id: build
        run: |
          set -euo pipefail
          cd engine-root/engine/src
          if [ "${{ steps.plan.outputs.uses-host-config }}" = "true" ]; then
            (cd flutter && ./bin/et build -c "${{ steps.plan.outputs.et-config }}") 2>&1 | tail -40
          else
            ./flutter/tools/gn ${{ steps.plan.outputs.gn-args }} \
              ${{ steps.plan.outputs.extra-gn-args }} 2>&1 | tail -20
            ninja -C "${{ steps.plan.outputs.out-dir }}" 2>&1 | tail -40
          fi
          ls -la "${{ steps.plan.outputs.out-dir }}" | head -20

      - name: Collect the artifact
        run: |
          set -euo pipefail
          mkdir -p out
          cd engine-root/engine/src
          cp "${{ steps.plan.outputs.engine-path }}" "$GITHUB_WORKSPACE/out/"
          cp "${{ steps.plan.outputs.gen-snapshot-path }}" "$GITHUB_WORKSPACE/out/"
          find "${{ steps.plan.outputs.out-dir }}" -name "flutter_embedder.h" \
            -exec cp {} "$GITHUB_WORKSPACE/out/" \; 2>/dev/null || true
          echo "${{ inputs.flutter_ref }}" > "$GITHUB_WORKSPACE/out/flutter.ref"
          ls -la "$GITHUB_WORKSPACE/out/"

      # The step that would have caught the mislabelled arm engine. It reads
      # the ELF header rather than trusting the path the build wrote to, and
      # it expects a host-architecture gen_snapshot beside a target-architecture
      # engine, because that is what a correct cross build produces.
      - name: Verify the architecture
        run: |
          set -euo pipefail
          dart run dartvel/packages/dartvel_cli/bin/dartvel.dart engine verify out \
            --arch "${{ inputs.arch }}" --mode "${{ inputs.mode }}"

      - name: Split into committable chunks
        run: |
          set -euo pipefail
          NAME="engine-${{ inputs.arch }}-${{ inputs.mode }}-${{ inputs.flutter_ref }}.tar.gz"
          tar -czf "$NAME" -C out .
          ls -lh "$NAME"
          dart run dartvel/packages/dartvel_cli/bin/dartvel.dart artifact split "$NAME" --out chunks
          ls -la chunks/

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ inputs.arch }}-${{ inputs.mode }}-chunks
          path: chunks/
          retention-days: 90

      - name: Report
        if: always()
        run: |
          {
            echo "### Engine build"
            echo ""
            echo "Flutter ref: \`${{ inputs.flutter_ref }}\` · mode: \`${{ inputs.mode }}\` · arch: \`${{ inputs.arch }}\`"
            echo ""
            echo "sync: \`${{ steps.sync.outcome }}\` · build: \`${{ steps.build.outcome }}\`"
            echo ""
            echo "Rejoin locally with:"
            echo '```'
            echo "dartvel artifact join chunks/*.manifest.json"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

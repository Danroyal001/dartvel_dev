name: Runtime verification

# Builds each target, RUNS it, and captures what it actually drew.
#
# Every target below except `linux` has only ever been verified by inspecting an
# artifact — that the build compiled and linked. It does not establish that the
# application starts, and twice now something has compiled and linked while
# being wrong: `dartvel build linux-cli` produced a GUI binary and reported
# success, and a Fuchsia plan named a command nothing installs. An artifact
# check cannot see either.
#
# So each job here ends with a screenshot or a captured frame, uploaded as an
# artifact. A green job with no image is not a pass.

on:
  # Every push, not on request. The repository is public, so Actions minutes on
  # standard runners are free — including the macOS and Windows jobs here — and
  # a verification suite nobody remembers to dispatch verifies nothing. Time is
  # the real cost, which is what the per-job timeouts bound.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      engine:
        description: Engine revision for the eLinux embedder
        required: false
        default: 83675ed27633283e7fc296c8bca22e841224c096

# A push that lands while this is running supersedes it. Without this the runs
# queue and every one of them finishes against a branch that has already moved
# on -- which is not a cost problem, it is a feedback one: the answer arrives
# for a commit nobody is looking at any more.
# On main a run that has started finishes, so main always has a verdict on a
# recent commit; a newer push waits behind it and replaces any run waiting.
# A group per commit instead queued a run for every push, faster than the
# runners could finish them. Anywhere else a newer push cancels the older run.
concurrency:
  group: runtime-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: 3.47.5
  # inputs.* exists only on workflow_dispatch. On a push it is the empty
  # string, which turned the engine URL into a directory listing and 404'd the
  # eLinux job the moment this workflow started running on pushes. The default
  # is the same revision the dispatch input carries.
  ENGINE_REVISION: ${{ inputs.engine || '83675ed27633283e7fc296c8bca22e841224c096' }}

jobs:
  # The reference: already runs headless, and the only target verified by
  # running rather than by inspection. It is here so the others have something
  # known-good to be compared against.
  linux-gui:
    name: linux — run and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Install desktop and capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake \
            pkg-config xvfb imagemagick x11-apps x11-utils

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Generate and build
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/linux-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel routes
          flutter build linux --release

      # continue-on-error so its own logs, and the steps below that read
      # them, still run. A capture that came back with nothing is caught by
      # "The capture must show the application" further down, which is not
      # continue-on-error -- so the job still goes red, with the diagnosis
      # attached instead of stopping at the first symptom. Without this the
      # step's exit code ended the job here and the three checks that would
      # have said why never ran.
      - name: Run it and photograph the window
        continue-on-error: true
        working-directory: examples/dartvel_example
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 3
          export DISPLAY=:99
          # Its own output kept: a blank screenshot with nothing else to
          # read is a mystery, and the app's first lines are the answer.
          ./build/linux/x64/release/bundle/dartvel_example > /tmp/diag/linux-app.log 2>&1 &
          APP=$!
          # Photographed when there is something to photograph. A fixed wait
          # is a race the runner sometimes loses, and losing it produces a
          # blank image that reads as a rendering failure -- the one thing
          # this job exists to detect, reported for the wrong reason. The
          # window is captured until it has more than a couple of colours in
          # it, or until the patience runs out and the blank one is kept as
          # the evidence it is.
          #
          # The application's window, not the screen. There is no window
          # manager here, so the window opens at its default 1280x720 in the
          # corner of a 1280x900 screen, and a photograph of the root window
          # showed the bottom 180 pixels as black -- which read as the app
          # failing to paint the lower part of its window, and was only the X
          # root around it. The root is kept as the fallback so a window that
          # never mapped still leaves evidence.
          for attempt in $(seq 1 20); do
            sleep 3
            # `|| true`, because GitHub runs every step with bash -e --
            # `shell: /usr/bin/bash -e {0}` -- and `set -uo pipefail` above
            # does not take that off. With pipefail on, a grep that matches
            # nothing fails the pipeline, and -e then killed the shell on
            # this line: before the echo, before the import, before anything
            # said why. That is the whole of it. The window had simply not
            # mapped within the first three seconds, the loop never reached
            # its second attempt, and the job reported a capture failure
            # with an empty log.
            WID=$(xwininfo -root -tree 2>/dev/null \
              | grep -m1 '"Oakline Coffee":' | awk '{ print $1 }' || true)
            if [ -n "$WID" ]; then
              xwininfo -id "$WID" | grep -E "Width|Height" || true
              import -display :99 -window "$WID" /tmp/diag/linux-gui.png \
                || echo "attempt $attempt: import of $WID failed"
            else
              # Say which windows there are. "no window called Oakline
              # Coffee" on its own is the same message whether the app has
              # not opened one yet or has opened one under another name, and
              # those have different fixes.
              echo "attempt $attempt: no Oakline Coffee window. On :99:"
              xwininfo -root -tree 2>/dev/null | sed -n '5,20p' || true
              import -display :99 -window root /tmp/diag/linux-gui.png \
                || echo "attempt $attempt: import of the root failed"
            fi
            colours=$(identify -format '%k' /tmp/diag/linux-gui.png 2>/dev/null || echo 0)
            echo "attempt $attempt: $colours colours"
            if [ "${colours:-0}" -gt 8 ]; then break; fi
          done
          echo "--- application output ---"; cat /tmp/diag/linux-app.log || true
          # What the running application published beside its lock: the
          # windows it has open and what its startup took. Copied out before
          # the process ends, because the file goes with it.
          cp "${XDG_RUNTIME_DIR:-/tmp}"/dartvel-dartvel_example.windows.json \
            /tmp/diag/linux-live.json 2>/dev/null || true
          kill $APP 2>/dev/null || true
          identify /tmp/diag/linux-gui.png

      # A job that captured nothing is not a pass: "The capture must show
      # the application", below, is what makes it red, and it is how tvOS
      # was caught going green while failing to build at all.
      #
      # Links, tapped on the device this job is running. A widget test cannot
      # tell a working link from one whose handler builds a callback and never
      # calls it -- the dartvel.dev header shipped dead while a widget suite
      # passed it. Only a running application can.
      - name: Links must navigate on this platform
        run: |
          set -euo pipefail
          cd examples/dartvel_example
          # Under xvfb-run, because the Xvfb started by the step above lives
          # and dies with that step's shell and DISPLAY went with it. A GTK
          # app with nowhere to open a window exits immediately, and the
          # driver reports that as "the log reader stopped unexpectedly, or
          # never started" -- which reads as a broken app rather than a
          # missing display.
          xvfb-run -a flutter test integration_test/link_navigation_test.dart \
            -d linux

      # Startup, phase by phase, from the application that just ran. A
      # profile the framework never fills is a number nobody can answer for,
      # and every phase here is one the generated runtime marks.
      - name: Startup is measured
        run: |
          set -euo pipefail
          if [ ! -f /tmp/diag/linux-live.json ]; then
            echo "::error::the application published nothing beside its lock"
            exit 1
          fi
          dart tool/ci/startup_check.dart /tmp/diag/linux-live.json

      - name: The capture must show the application
        run: |
          set -euo pipefail
          dart pub get --directory "$GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify \
            "/tmp/diag/linux-gui.png" --label "linux" \
            --min-width 320 --min-height 240

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: screenshot-linux-gui, path: /tmp/diag/, if-no-files-found: warn }

  # The one asked for. Sony's embedder is a Wayland client, so it needs a
  # compositor — there is no such thing as running it "headless" on its own.
  #
  # Weston on its X11 backend inside Xvfb is the arrangement chosen: it gives a
  # real Wayland compositor whose output lands on an X display that can be
  # screenshotted with ordinary tools. Weston's own headless backend would need
  # the screenshooter protocol wired up, which is more moving parts for the same
  # picture.
  elinux:
    name: sony-elinux — run on a virtual device and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Install the virtual device and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build pkg-config clang \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libinput-dev libudev-dev libsystemd-dev libx11-dev unzip \
            weston xvfb imagemagick mesa-utils libgl1-mesa-dri
          sudo apt-get install -y -qq ninja-build libgtk-3-dev

      - name: Fetch both engines
        run: |
          set -euo pipefail
          BASE="https://storage.googleapis.com/flutter_infra_release/flutter/$ENGINE_REVISION"
          mkdir -p engine engine-release
          # The official standalone engine, which is the JIT build — that is
          # what it is, established by running it and reading the error rather
          # than by its size.
          curl -fsSL -o engine/embedder.zip "$BASE/linux-x64/linux-x64-embedder.zip"
          curl -fsSL -o engine/artifacts.zip "$BASE/linux-x64/artifacts.zip"
          unzip -qo engine/embedder.zip -d engine/
          unzip -qo engine/artifacts.zip -d engine/

          # The release engine, built from source by engine-build.yml because
          # Google publishes no standalone release build.
          curl -fsSL -o engine-release/engine.tar.gz \
            https://github.com/Danroyal001/dartvel_elinux/releases/download/engine-83675ed276/elinux-x64-release-engine.tar.gz
          tar -xzf engine-release/engine.tar.gz -C engine-release/
          ls -la engine-release/

      - name: Build Sony's embedder against it
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/sony/flutter-embedded-linux.git elinux-src
          cd elinux-src
          cmake -E make_directory build
          cp ../engine/libflutter_engine.so build/
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DUSER_PROJECT_PATH=examples/flutter-wayland-client
          cmake --build . --config Release
          ls -la flutter-client

      - name: Install the artifacts where dartvel build expects them
        run: |
          set -euo pipefail
          DEST="$HOME/.dartvel/toolchains/dartvel_elinux/artifacts"
          mkdir -p "$DEST"
          cp elinux-src/build/flutter-client "$DEST/"
          cp engine/libflutter_engine.so engine/icudtl.dat engine/gen_snapshot "$DEST/"

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      # A DEBUG bundle, deliberately, and this is the correction that matters:
      # the official standalone engine is the JIT build, not the release build.
      # It carries the strings kernel_blob.bin and "Not running in AOT mode",
      # which a release engine has no use for. Pairing it with an AOT libapp.so
      # — which is what `dartvel build sony-elinux` produces — fails inside
      # FlutterEngineInitialize with exactly that message.
      #
      # So this proves the stack with the pieces that match: JIT engine plus
      # kernel_blob.bin. The release path waits on engine-build.yml.
      - name: Assemble a debug eLinux bundle the JIT engine can run
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag
          exec > >(tee -a /tmp/diag/assemble.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel routes
          flutter build linux --debug
          SRC=build/linux/x64/debug/bundle
          OUT=build/elinux/x64/debug/bundle
          mkdir -p "$OUT/lib" "$OUT/data"
          cp -r "$SRC/data/flutter_assets" "$OUT/data/"
          cp "$SRC/data/icudtl.dat" "$OUT/data/"
          cp "$HOME/.dartvel/toolchains/dartvel_elinux/artifacts/flutter-client" "$OUT/"
          cp "$HOME/.dartvel/toolchains/dartvel_elinux/artifacts/libflutter_engine.so" "$OUT/lib/"
          echo "--- assembled ---"; find "$OUT" -maxdepth 2
          echo "--- kernel present? (JIT needs it) ---"
          ls -l "$OUT/data/flutter_assets/kernel_blob.bin"

      # Display and application in ONE step, deliberately.
      #
      # They were two, and the compositor started in the first did not survive
      # into the second: weston.log showed a healthy compositor and the
      # application step produced nothing at all. A background process belongs
      # to its step's process group, so anything the next step needs has to be
      # started alongside it. The linux job does the same thing and works,
      # which is what made the difference visible.
      - name: Run on the virtual eLinux device and photograph it
        id: run
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/diag
          exec > >(tee -a /tmp/diag/elinux-run.log) 2>&1

          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"

          echo "=== starting Xvfb ==="
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 3

          echo "=== starting weston (the virtual device's compositor) ==="
          weston --backend=x11-backend.so --width=1280 --height=720 \
            --socket=wayland-1 --idle-time=0 > /tmp/diag/weston.log 2>&1 &
          sleep 10
          echo "--- wayland sockets ---"
          ls -la "$XDG_RUNTIME_DIR" || echo "(none)"
          test -S "$XDG_RUNTIME_DIR/wayland-1" && echo "compositor socket present" \
            || echo "NO COMPOSITOR SOCKET — the app cannot connect"

          BUNDLE="$GITHUB_WORKSPACE/examples/dartvel_example/build/elinux/x64/debug/bundle"
          echo "=== bundle contents ==="
          find "$BUNDLE" -maxdepth 2

          cd "$BUNDLE"
          export WAYLAND_DISPLAY=wayland-1
          export LD_LIBRARY_PATH="$PWD/lib:${LD_LIBRARY_PATH:-}"
          # There is no GPU on a runner. Without these the client's EGL falls
          # through to ZINK, fails vkCreateInstance with
          # VK_ERROR_INCOMPATIBLE_DRIVER, and never gets a context — which
          # looks like an embedder fault and is not one.
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe

          echo "=== what the client expects ==="
          ./flutter-client --help 2>&1 | head -20 || true

          echo "=== running ==="
          ./flutter-client --bundle="$PWD" > /tmp/diag/elinux-app.log 2>&1 &
          APP=$!
          sleep 15
          if kill -0 $APP 2>/dev/null; then echo "still running"; else echo "EXITED EARLY"; fi

          import -window root /tmp/diag/elinux.png || echo "screenshot failed"
          identify /tmp/diag/elinux.png || true
          echo "=== application output ==="
          cat /tmp/diag/elinux-app.log || true
          kill $APP 2>/dev/null || true

      # The production path, and the question the debug run cannot answer.
      #
      # The debug bundle above pairs a JIT engine with kernel_blob.bin and
      # works. A release bundle pairs an AOT libapp.so with a release engine,
      # and nothing has ever run that combination — the engine was built from
      # source only after the official one turned out to be JIT. Inspecting it
      # was inconclusive: the JIT error string is present in both builds, so
      # only running an AOT bundle settles it.
      - name: Assemble and run a release eLinux bundle
        id: release
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/elinux-release.log) 2>&1

          cd examples/dartvel_example
          flutter build linux --release
          OUT=build/elinux/x64/release/bundle
          mkdir -p "$OUT/lib" "$OUT/data"
          SRC=build/linux/x64/release/bundle
          cp -r "$SRC/data/flutter_assets" "$OUT/data/"
          cp "$SRC/data/icudtl.dat" "$OUT/data/"
          # The AOT library the desktop release build produced, and the
          # from-source release engine — the pairing under test.
          cp "$SRC/lib/libapp.so" "$OUT/lib/"
          cp "$GITHUB_WORKSPACE/engine-release/libflutter_engine.so" "$OUT/lib/"
          cp "$HOME/.dartvel/toolchains/dartvel_elinux/artifacts/flutter-client" "$OUT/"
          echo "--- assembled ---"; find "$OUT" -maxdepth 2

          cd "$OUT"
          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp/xdg
          export WAYLAND_DISPLAY=wayland-1
          export LD_LIBRARY_PATH="$PWD/lib:${LD_LIBRARY_PATH:-}"
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe

          ./flutter-client --bundle="$PWD" > /tmp/diag/elinux-release-app.log 2>&1 &
          APP=$!
          sleep 15
          if kill -0 $APP 2>/dev/null; then echo "still running"; else echo "EXITED EARLY"; fi
          import -window root /tmp/diag/elinux-release.png || echo "screenshot failed"
          echo "=== application output ==="
          cat /tmp/diag/elinux-release-app.log || true
          kill $APP 2>/dev/null || true

      # A job that captured nothing is not a pass. The run step above is
      # continue-on-error so its logs still upload; this is not, so the job
      # goes red when there is no evidence — which is how tvOS went green while
      # failing to build at all.
      - name: The capture must show the application
        run: |
          set -euo pipefail
          dart pub get --directory "$GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify \
            "/tmp/diag/elinux.png" --label "sony-elinux debug" \
            --min-width 320 --min-height 240
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify \
            "/tmp/diag/elinux-release.png" --label "sony-elinux release" \
            --min-width 320 --min-height 240

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-elinux
          path: /tmp/diag/
          if-no-files-found: warn

  # The browser is its own runner; headless Chrome renders and screenshots
  # without any of the display scaffolding the native targets need.
  web:
    name: web — serve, load in a browser and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Install capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          cargo install cbindgen --locked || true

      - name: Build for web
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/web-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel routes
          flutter build web --release
          echo "--- output ---"; ls build/web | head

      - name: Serve it and photograph the page
        id: run
        continue-on-error: true
        working-directory: examples/dartvel_example/build/web
        run: |
          set -euo pipefail
          dart "$GITHUB_WORKSPACE/tool/ci/serve.dart" 8080 > /tmp/serve.log 2>&1 &
          sleep 3
          # CanvasKit downloads and the first frame takes a moment; a shot taken
          # immediately catches a blank canvas and reads as a failure.
          mkdir -p /tmp/diag
          exec > >(tee -a /tmp/diag/web-run.log) 2>&1
          echo "=== which browser is present ==="
          which google-chrome chromium chromium-browser 2>&1 || true
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "using: $BROWSER"
          curl -sI http://localhost:8080/ | head -3
          "$BROWSER" --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=20000 --window-size=1280,900 \
            --screenshot=/tmp/diag/web.png http://localhost:8080/ 2>&1 | tail -5
          identify /tmp/diag/web.png || echo "no screenshot produced"

          # The mounted module, at the route the parent gives it. The example
          # mounts one at /notes, and a module whose pages are in the route
          # index but not in the running application is the failure this
          # proves absent -- a crawler follows the link, gets HTML, and the
          # app renders its own not-found page.
          #
          # Served with a fallback to index.html, which is what path URLs
          # need and what deploy configuration writes; the plain file server
          # above answers 404 for a route with no file.
          dart "$GITHUB_WORKSPACE/tool/ci/serve.dart" 8082 --spa \
            > /tmp/serve-fallback.log 2>&1 &
          sleep 3
          # Dumped until the module's screen is in it, not once and hoped.
          # A single dump is a race against the first paint: the engine boots,
          # the router resolves, and on a runner that is stalling on
          # ReadPixels that can land after the dump, which reads as "the
          # module did not render" and is nothing of the kind.
          for attempt in 1 2 3 4 5 6 7 8; do
            "$BROWSER" --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=20000 --window-size=1280,900 \
              --dump-dom http://localhost:8082/notes > /tmp/diag/web-module.html 2>/dev/null || true
            if grep -q "A module, mounted into the example application" /tmp/diag/web-module.html; then
              echo "the module's screen was in the DOM on attempt $attempt"
              break
            fi
            echo "attempt $attempt: not painted yet"
            sleep 3
          done
          echo "--- the mounted module's page, first 400 bytes ---"
          head -c 400 /tmp/diag/web-module.html || true

      # A job that captured nothing is not a pass. The run step above is
      # continue-on-error so its logs still upload; this is not, so the job
      # goes red when there is no evidence — which is how tvOS went green while
      # failing to build at all.
      - name: The capture must show the application
        run: |
          set -euo pipefail
          dart pub get --directory "$GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify \
            "/tmp/diag/web.png" --label "web" \
            --min-width 320 --min-height 240

      # A mounted module's screen, in the running application at the route
      # the parent gives it. Its pages being in the route index and absent
      # from the application is the failure this rules out -- a crawler
      # follows the link, gets HTML, and the app renders its own not-found
      # page. Not continue-on-error: this one is the verdict.
      - name: The mounted module must render at its route
        run: |
          set -euo pipefail
          if ! grep -q "A module, mounted into the example application" /tmp/diag/web-module.html; then
            echo "::error::/notes did not render the mounted module's screen"
            exit 1
          fi
          echo "the module's screen rendered at /notes"

          # And its asset is in the bundle under the package path, which is
          # where Flutter serves another package's files from. The module
          # asks for its own path and the registry answers with this one; if
          # the build did not carry the file here, that answer points at
          # nothing.
          cd examples/dartvel_example
          if ! grep -rq "packages/dartvel_example_notes/assets/logo.png" build/web/assets/; then
            echo "::error::the mounted module's asset is not in the bundle"
            ls build/web/assets | head
            exit 1
          fi
          echo "the module's asset is bundled under its package path"

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: screenshot-web, path: /tmp/diag/, if-no-files-found: warn }

  # An emulator, which needs KVM — the runner has it but not the permissions,
  # and without the udev rule the emulator falls back to software and times out
  # rather than failing outright.
  android:
    name: android — run on an emulator and screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Generate and build the APK
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/android-build.log) 2>&1
          cd examples/dartvel_example

          # A kiosk, declared here rather than in the repository. The example
          # is the demo every other job runs, and a kiosk that owns the whole
          # device is not what a demo should be -- but a lock-task launcher
          # is only built for a project that asks for one, so the project has
          # to ask. This is the deployment being tested, in the checkout this
          # job owns.
          # Under dartvel:, not at the end of the file. Appending put it
          # under whatever the last top-level key happens to be -- hooks: as
          # it stands -- and the declaration then reached nothing, which is
          # what the guards below exist to catch.
          #
          # sed rather than a heredoc: a heredoc's body sits at its own
          # indentation, and a line indented less than this block scalar ends
          # the scalar, which YAML reads as new top-level keys.
          sed -i 's|^dartvel:$|dartvel:\n  kiosk:\n    enabled: true\n    scope: device\n    home: /|' \
            pubspec.yaml
          sed -n '/^dartvel:/,/^    home:/p' pubspec.yaml

          flutter pub get

          # Through `dartvel build`, not `flutter build apk`. The kiosk
          # manifest entries and the device-admin receiver are written by
          # Dartvel's own build step, so calling Flutter directly builds an
          # APK with none of them -- which is what the guards below caught
          # the first time this ran. It also runs generation, so the separate
          # routes call is not needed.
          dart run dartvel_cli:dartvel build android --profile development
          ls -la build/app/outputs/flutter-apk/

          # What the kiosk declaration was supposed to write. A build that
          # silently skipped it would leave dpm set-device-owner with nothing
          # to point at, and the failure would arrive as a confusing adb
          # error rather than as this.
          test -f android/app/src/main/java/com/example/dartvel_example/DartvelDeviceAdminReceiver.java
          test -f android/app/src/main/res/xml/dartvel_device_admin.xml
          grep -q "android.intent.category.HOME" android/app/src/main/AndroidManifest.xml

          # And where it stops being there. The guards above check the files
          # beside the manifest and one line inside it, and passed for a
          # build whose installed package had no device-admin receiver at
          # all -- so "the receiver was written" and "the receiver is on the
          # device" were never connected. This reads the source manifest and
          # then reads the manifest back out of the APK that was actually
          # built, so a failure says which of the two lost it.
          dart "$GITHUB_WORKSPACE/tool/ci/android_manifest_check.dart" .
          echo "the kiosk declaration reached the manifest and the receiver"

      - name: Boot the emulator, install and photograph
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # One line, deliberately. This action runs each *line* of `script`
          # as its own `sh -c`, so a multi-line `(cd example && flutter test
          # ...)` reaches the shell as an opening parenthesis and nothing
          # else -- "Syntax error: end of file unexpected". That is how the
          # lock-task verification silently never ran while this job went
          # green. Everything it used to do is in the Dart tool, which also
          # writes a verdict for the gate below.
          script: dart tool/ci/android_device_checks.dart

      # The step above is continue-on-error so its diagnostics still upload,
      # which means it cannot fail the job on its own. This reads what it
      # decided. A missing verdict is a failure too: it means the tool never
      # reached the end, which is the case that used to read as success.
      - name: The device agreed with the tests
        run: |
          set -euo pipefail
          test -f /tmp/diag/android-verdict.txt \
            || { echo "no verdict: the device checks did not finish"; exit 1; }
          cat /tmp/diag/android-verdict.txt
          head -1 /tmp/diag/android-verdict.txt | grep -qx passed

      # A job that captured nothing is not a pass. The run step above is
      # continue-on-error so its logs still upload; this is not, so the job
      # goes red when there is no evidence — which is how tvOS went green while
      # failing to build at all.
      - name: The capture must show the application
        run: |
          set -euo pipefail
          dart pub get --directory "$GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify \
            "/tmp/diag/android.png" --label "android" \
            --min-width 320 --min-height 240

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: screenshot-android, path: /tmp/diag/, if-no-files-found: warn }

  # The repository is public, so macOS minutes are free and unlimited. macOS
  # and iOS share a job because they share a checkout, a Flutter install and a
  # generation step — splitting them would repeat all three to no purpose.
  apple:
    name: macos and ios — run and screenshot
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Generate
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/apple-generate.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel routes

      - name: Run on macOS and photograph the screen
        id: macos
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/macos-run.log) 2>&1
          cd examples/dartvel_example
          flutter build macos --debug
          APP=$(find build/macos -name "*.app" -maxdepth 4 | head -1)
          echo "app: $APP"
          open "$APP"
          sleep 20
          # The whole screen: a runner has no window manager to ask for one
          # window, and -x keeps the shutter sound out of the log.
          screencapture -x /tmp/diag/macos.png
          sips -g pixelWidth -g pixelHeight /tmp/diag/macos.png || true
          # Gone before the integration suite launches its own copy; see the
          # Windows job for why a running instance fails that suite.
          pkill -f dartvel_example.app || true
          sleep 2

      - name: Run on an iOS simulator and photograph it
        id: ios
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/ios-run.log) 2>&1
          cd examples/dartvel_example
          xcrun simctl list devices available | head -20
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [0-9]+[^(]*\(([-A-F0-9]+)\)" | grep -oE "[-A-F0-9]{36}")
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          flutter build ios --debug --simulator
          APP=$(find build/ios/iphonesimulator -name "*.app" -maxdepth 2 | head -1)
          echo "app: $APP"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.example.dartvelExample || \
            xcrun simctl launch "$DEVICE" com.example.dartvel-example || true
          sleep 25
          xcrun simctl io "$DEVICE" screenshot /tmp/diag/ios.png
          ls -la /tmp/diag/ios.png

      # A job that captured nothing is not a pass. The run step above is
      # continue-on-error so its logs still upload; this is not, so the job
      # goes red when there is no evidence — which is how tvOS went green while
      # failing to build at all.
      # Links, tapped on the device this job is running. A widget test cannot
      # tell a working link from one whose handler builds a callback and never
      # calls it -- the site header shipped dead while a widget suite passed
      # it. Only a running application can.
      - name: Links must navigate on this platform
        shell: bash
        run: |
          set -euo pipefail
          cd examples/dartvel_example
          flutter test integration_test/link_navigation_test.dart -d macos

      - name: The capture must show the application
        run: |
          set -euo pipefail
          dart pub get --directory "$GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify \
            "/tmp/diag/macos.png" --label "macos" \
            --min-width 320 --min-height 240
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify \
            "/tmp/diag/ios.png" --label "ios" \
            --min-width 320 --min-height 240

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: screenshot-apple, path: /tmp/diag/, if-no-files-found: warn }

  # The iOS DV.Platform bindings, run on a simulator. The apple job above
  # builds with plain `flutter build ios`, which compiles none of Dartvel's
  # Swift, so the shim behind share, location, contacts, the pickers,
  # permissions, sensors, Bluetooth, notifications and the network signal has
  # to come from `dartvel build ios` -- and then from a running app, because
  # nothing on Linux compiles Swift or proves a symbol resolves.
  #
  # Actions on Danroyal001 has been billing-locked since 2026-09, so this job
  # had not run when it was added: docs/build-targets.md records the bindings
  # as unverified on iOS until it goes green.
  ios-device-apis:
    name: ios — device bindings on a simulator
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [0-9]+[^(]*\(([-A-F0-9]+)\)" | grep -oE "[-A-F0-9]{36}")
          echo "device: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          # What the test reads back: a position, and the grants a person
          # would otherwise have to tap.
          xcrun simctl location "$DEVICE" set 6.5244,3.3792
          xcrun simctl privacy "$DEVICE" grant location com.example.dartvelExample || true
          xcrun simctl privacy "$DEVICE" grant contacts com.example.dartvelExample || true

      - name: Build with dartvel, which writes the shim into the Runner target
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/ios-shim-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel build ios --simulator --debug
          # The build must have written and wired it; a shim left out of the
          # target compiles to nothing and every binding stays unregistered.
          test -f ios/Runner/DartvelPlatform.swift
          grep -q "DartvelPlatform.swift in Sources" ios/Runner.xcodeproj/project.pbxproj
          grep -q NSCameraUsageDescription ios/Runner/Info.plist

      - name: The device bindings answer on the simulator
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/ios-device-apis.log) 2>&1
          cd examples/dartvel_example
          # Re-grant after the install the test run does, which resets them.
          ( sleep 90; xcrun simctl privacy "${{ steps.sim.outputs.device }}" grant location com.example.dartvelExample || true
            xcrun simctl privacy "${{ steps.sim.outputs.device }}" grant contacts com.example.dartvelExample || true ) &
          flutter test integration_test/ios_device_apis_test.dart -d "${{ steps.sim.outputs.device }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: ios-device-apis, path: /tmp/diag/, if-no-files-found: warn }

  windows:
    name: windows — run and screenshot
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Generate and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\diag | Out-Null
          cd examples/dartvel_example
          flutter pub get 2>&1 | Tee-Object -FilePath C:\diag\windows-build.log
          dart run dartvel_cli:dartvel routes 2>&1 | Tee-Object -Append -FilePath C:\diag\windows-build.log
          flutter build windows --debug 2>&1 | Tee-Object -Append -FilePath C:\diag\windows-build.log

      - name: Run it and photograph the desktop
        id: run
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path examples/dartvel_example/build/windows -Filter dartvel_example.exe -Recurse |
                 Select-Object -First 1
          "exe: $($exe.FullName)" | Tee-Object -Append -FilePath C:\diag\windows-run.log
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 20
          # A runner session has a desktop even with nobody logged in
          # interactively, so a full-screen grab is the reliable capture.
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("C:\diag\windows.png")
          "saved $($bounds.Width)x$($bounds.Height)" | Tee-Object -Append -FilePath C:\diag\windows-run.log
          # Gone before the integration suite launches its own copy. A running
          # instance makes the suite's launch a second launch, which hands its
          # arguments over and exits -- as designed -- and the harness then
          # reports an app that vanished as "no tests were found".
          Stop-Process -Name dartvel_example -Force -ErrorAction SilentlyContinue

      # Same rule as the other jobs: no capture is not a pass.
      # Links, tapped on the device this job is running. A widget test cannot
      # tell a working link from one whose handler builds a callback and never
      # calls it -- the site header shipped dead while a widget suite passed
      # it. Only a running application can.
      - name: Links must navigate on this platform
        shell: bash
        run: |
          set -euo pipefail
          cd examples/dartvel_example
          flutter test integration_test/link_navigation_test.dart -d windows

      - name: The capture must show the application
        shell: pwsh
        run: |
          dart pub get --directory "$env:GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$env:GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify `
            C:\diag\windows.png --label windows --min-width 320 --min-height 240
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: screenshot-windows, path: C:\diag\, if-no-files-found: warn }

  # tvOS on a simulator. Apple ships no tvOS Flutter embedder, so this rides
  # the community fluttertv/flutter-tvos CLI, which carries its own Flutter SDK
  # and origin-signed tvOS engine artifacts. Device builds need a configured
  # signing team; --simulator --debug is the only unsigned path.
  tvos:
    name: tvos — run on a simulator and screenshot
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      # A standard SDK for the Dartvel CLI. The tvOS embedder carries its own
      # Flutter and uses it for the build, but `dart run dartvel_cli:dartvel`
      # needs a dart on PATH — without this the job dies on "dart: command not
      # found" after installing the whole embedder.
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Install the tvOS embedder
        id: embedder
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/tvos-setup.log) 2>&1
          git clone --depth 1 https://github.com/Danroyal001/dartvel_tvos.git "$HOME/dartvel_tvos"
          echo "$HOME/dartvel_tvos/bin" >> $GITHUB_PATH
          "$HOME/dartvel_tvos/bin/flutter-tvos" --version 2>&1 | head -5

      - name: Build and run on a tvOS simulator
        id: run
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/tvos-run.log) 2>&1
          export PATH="$HOME/dartvel_tvos/bin:$PATH"

          echo "=== available tvOS simulators ==="
          xcrun simctl list devices available | grep -i "apple tv" || echo "(none)"
          DEVICE=$(xcrun simctl list devices available | grep -i "apple tv" | grep -oE "[-A-F0-9]{36}" | head -1)
          if [ -z "$DEVICE" ]; then
            echo "no tvOS simulator on this runner image"
            exit 1
          fi
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true

          cd examples/dartvel_example
          flutter-tvos pub get
          # Through `dartvel build`, not the embedder directly. The first
          # attempt called flutter-tvos itself and was told "This project is
          # not configured for tvOS" — the app has no tvos/ directory, and
          # generating it is exactly what Dartvel's embedded build path does.
          # Calling the embedder directly also tests the wrong thing.
          dart run dartvel_cli:dartvel routes
          dart run dartvel_cli:dartvel build tvos --simulator 2>&1 | tail -25
          APP=$(find build/tvos -name "*.app" -maxdepth 3 | head -1)
          echo "app: $APP"
          [ -n "$APP" ] || exit 1
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.example.dartvelExample || true
          sleep 25
          xcrun simctl io "$DEVICE" screenshot /tmp/diag/tvos.png
          ls -la /tmp/diag/tvos.png

      # A job that captured nothing is not a pass. The run step above is
      # continue-on-error so its logs still upload; this is not, so the job
      # goes red when there is no evidence — which is how tvOS went green while
      # failing to build at all.
      - name: The capture must show the application
        run: |
          set -euo pipefail
          dart pub get --directory "$GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" capture verify \
            "/tmp/diag/tvos.png" --label "tvos" \
            --min-width 320 --min-height 240

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: screenshot-tvos, path: /tmp/diag/, if-no-files-found: warn }

  # The targets that cannot build here, asserted to fail the way they are
  # supposed to.
  #
  # This is end-to-end verification too, and the kind most often skipped: a
  # target that is meant to skip cleanly can instead crash, hang, or — as
  # linux-cli did — build something else entirely and report success. Checking
  # the refusal is checking behaviour.
  refusals:
    name: blocked and gated targets refuse correctly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Each blocked target skips, and says why
        id: run
        continue-on-error: true
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/refusals.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel routes

          failures=0
          # visionos and linux-cli are paid targets: on this free install they
          # are refused with the plan that unlocks them.
          for target in tizen webos sony-elinux visionos linux-cli; do
            echo "::group::$target"
            out=$(dart run dartvel_cli:dartvel build "$target" --no-auto-install 2>&1 || true)
            echo "$out" | tail -12
            # The requirement: it must not claim plain success, and it must name
            # what is missing. A silent skip is as bad as a false success —
            # nobody can act on either.
            if echo "$out" | grep -qiE "skipping|not installed|not found|blocked|cannot|paid target"; then
              echo "PASS: $target refused and said why"
            else
              echo "FAIL: $target neither built nor explained itself"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "failures: $failures"
          exit $failures

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: refusals, path: /tmp/diag/, if-no-files-found: warn }

  # The other web target. `web` prerenders a file per route; this one keeps one
  # shell and assembles each page when it is asked for, so the thing to verify
  # is that two different URLs come back different -- which serving the build
  # as plain files would not do, and did not, for as long as nothing read the
  # manifest.
  web-server:
    name: web-server — render each route on request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }
      - run: cargo install cbindgen --locked || true

      - name: Build the site for a server
        run: |
          set -euo pipefail
          cd sites/dartvel_site
          flutter pub get
          dart run dartvel_cli:dartvel build web-server
          test -f build/web/dartvel_routes.json

          # The static pages must be gone. If they survive, a server that falls
          # through to files serves yesterday's copy of every route and the
          # symptom is a page that will not update however often it deploys.
          for route in docs features cloud; do
            if [ -f "build/web/$route/index.html" ]; then
              echo "::error::build/web/$route/index.html survived the web-server build"
              exit 1
            fi
          done

      - name: Every route must be rendered, and rendered differently
        run: |
          set -euo pipefail
          # The deployment is one file. Copied alone into an empty directory
          # and started with nothing configured, it has to serve the web app
          # from inside itself, assemble each page when it is asked for, and
          # create its SQLite database on the first run. `dartvel dev --release`
          # serves build/web beside the project, so it proves none of that.
          test -x sites/dartvel_site/build/server
          DEPLOY=$(mktemp -d)
          cp sites/dartvel_site/build/server "$DEPLOY/server"
          test ! -e "$DEPLOY/dartvel_data/data.db"
          (cd "$DEPLOY" && exec env -i PATH=/usr/bin:/bin DARTVEL_PORT=8097 ./server > /tmp/diag/server.log 2>&1) &
          SERVER=$!
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8097/ && break
            sleep 1
          done

          for route in / /docs /features /cloud; do
            curl -sf "http://127.0.0.1:8097$route" > "/tmp/diag/page$(echo "$route" | tr '/' '_').html"
          done
          curl -sf -o /dev/null http://127.0.0.1:8097/main.dart.js
          kill $SERVER 2>/dev/null || true

          if [ ! -f "$DEPLOY/dartvel_data/data.db" ]; then
            echo "::error::the binary did not create its SQLite database on the first run"
            cat /tmp/diag/server.log
            exit 1
          fi

          dart "$GITHUB_WORKSPACE/tool/ci/prerendered_pages_check.dart" /tmp/diag 4

      - name: A release build carries no dashboard
        working-directory: sites/dartvel_site
        run: |
          set -euo pipefail
          # dartvel build defaults to --profile release, and a release build serves
          # the admin only when the project asked for one. An application
          # deployed by somebody who never read this must not acquire an
          # admin endpoint out of convenience.
          if [ -d build/web/__admin ]; then
            echo "::error::a release build wrote an admin dashboard"
            exit 1
          fi

      - name: The studio must be served by the backend, and only what it holds
        run: |
          set -euo pipefail
          cd sites/dartvel_site

          # A development build, which is the case that gets the dashboard
          # with no configuration at all -- and the one a developer meets
          # first.
          dart run dartvel_cli:dartvel build web-server --profile development

          # Written by the build. Everything around the admin -- the mount,
          # the hidden answer, the file serving -- was built and working
          # while nothing ever put a file in the directory it reads from, so
          # enabling it produced a 404 from a mount that was correct.
          test -f build/web/__admin/index.html
          test -f build/web/__admin/graph.json
          # Studio itself, compiled for the mount, not the read-only
          # manifest page that used to stand in for it.
          test -f build/web/__admin/main.dart.js
          test ! -f build/web/__admin/admin.js

          dart run dartvel_cli:dartvel dev --release --port 8098 \
            > /tmp/diag/release.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8098/ && break
            sleep 1
          done

          # Studio is not open to whoever reaches the port. The release server
          # prints a one-time link and only a request carrying that grant is
          # answered; everybody else gets what a missing route gets. This
          # step used to curl the mount with nothing and expect the dashboard,
          # so it has failed since the grant landed -- on the security
          # property working.
          code=$(curl -s -o /tmp/diag/studio-unclaimed.html \
            -w '%{http_code}' http://127.0.0.1:8098/__studio)
          if grep -q '<title>Studio' /tmp/diag/studio-unclaimed.html; then
            echo "::error::Studio answered a request with no grant ($code)"
            exit 1
          fi

          # Then the browser's path: open the printed link, which sets the
          # cookie for the mount and redirects without the token in the URL.
          GRANT=$(grep -o 'http://localhost:8098/__studio/?dev_grant=[A-Za-z0-9._~-]*' \
            /tmp/diag/release.log | head -1 | sed 's|http://localhost|http://127.0.0.1|')
          if [ -z "$GRANT" ]; then
            echo "::error::the release server printed no development grant link"
            cat /tmp/diag/release.log
            exit 1
          fi
          curl -sf -c /tmp/diag/studio-cookies -o /dev/null -L "$GRANT"

          curl -sf -b /tmp/diag/studio-cookies \
            http://127.0.0.1:8098/__studio > /tmp/diag/studio.html
          grep -q '<title>Studio' /tmp/diag/studio.html
          grep -q '<base href="/__studio/">' /tmp/diag/studio.html
          curl -sf -b /tmp/diag/studio-cookies -o /dev/null \
            http://127.0.0.1:8098/__studio/main.dart.js

          curl -sf -b /tmp/diag/studio-cookies \
            http://127.0.0.1:8098/__studio/graph.json \
            > /tmp/diag/studio-graph.json

          # A path that climbs out of the mount must not be answered with
          # anything from inside it. --path-as-is so curl sends the dots
          # rather than resolving them, though the server resolves them
          # before the handler sees the request -- which is why this asserts
          # what came back rather than a status. The handler's own refusal is
          # the one the unit test drives directly, with a Request built by
          # hand; this is the end-to-end half, and what it can show is that
          # the studio is not served from outside its own mount.
          curl -s --path-as-is -b /tmp/diag/studio-cookies \
            -o /tmp/diag/studio-climb.html \
            'http://127.0.0.1:8098/__studio/../index.html'
          curl -s --path-as-is -b /tmp/diag/studio-cookies \
            -o /tmp/diag/studio-encoded.html \
            'http://127.0.0.1:8098/__studio/%2e%2e/index.html'
          kill $SERVER 2>/dev/null || true

          dart "$GITHUB_WORKSPACE/tool/ci/studio_graph_check.dart" \
            /tmp/diag/studio-graph.json models routes functions jobs

          for page in studio-climb studio-encoded; do
            if grep -q '<title>Studio' "/tmp/diag/$page.html"; then
              echo "::error::$page was answered with the studio"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: web-server-pages, path: /tmp/diag/, if-no-files-found: warn }

  webos:
    name: webos — assemble a package against the ARM engine
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag

      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5

      - uses: dtolnay/rust-toolchain@stable

      # The 32-bit ARM engine Google does not publish, built from source and
      # released on the fork. Everything else about webOS was reachable all
      # along; this was the whole blocker.
      - name: Fetch the ARM engine
        run: |
          set -euo pipefail
          mkdir -p engine
          curl -sSL -o engine.tar.gz \
            https://github.com/Danroyal001/dartvel_webos/releases/download/engine-arm-3.47.5/engine-linux-arm-release-3.47.5.tar.gz
          tar -xzf engine.tar.gz -C engine
          ls -la engine

      # Asserted before anything is built on top of it. An x86-64 engine in
      # an ARM package installs and then does nothing on the television, and
      # this project has already shipped an engine named for an architecture
      # it was not.
      - name: The engine must be 32-bit ARM
        run: |
          set -euo pipefail
          dart pub get --directory packages/dartvel_cli
          dart run packages/dartvel_cli/bin/dartvel.dart engine verify engine \
            --arch arm --mode release
          readelf -A engine/libflutter_engine.so | grep -E "Tag_CPU_arch:|Tag_ABI_VFP_args"

      # armhf packages come from ports.ubuntu.com, and the existing sources
      # have to be pinned to amd64 first or every one of them 404s for the new
      # architecture.
      #
      # Every suite the amd64 side has, security included. A dev package marked
      # Multi-Arch: same must be the exact same version on both architectures,
      # so when a security update lands for mesa the runner's amd64 mirror has
      # a version the armhf sources cannot offer -- and apt reports that as
      # "you have held broken packages", naming nothing. Leaving noble-security
      # out is why this job passed for weeks and then failed on unchanged code.
      #
      # Adding the suite narrowed that window without closing it: the ports
      # archive builds after the amd64 one, so a mesa update lands on one side
      # first and the job fails for however long the gap is. The fix is not to
      # ask for mesa at all. Cross-compiling needs the EGL and GLES *headers*,
      # which are Khronos' and come from libglvnd as libegl-dev and
      # libgles-dev -- both in noble/main, neither in -updates, and neither
      # pinned to a mesa version. The implementation is on the television.
      #
      # The install does not run -qq. apt's reasoning is the only thing that
      # says which package broke, and twice now it has been thrown away.
      - name: Enable armhf packages
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture armhf
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' \
            /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/armhf.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security noble-backports
          Components: main universe
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update -qq
          sudo apt-get install -y crossbuild-essential-armhf \
            libwayland-dev:armhf libxkbcommon-dev:armhf \
            libegl-dev:armhf libgles-dev:armhf wayland-protocols
          # What the CMake build looks for, so a missing one is named here
          # rather than as a compile error four minutes later. Against the
          # armhf pkg-config path the toolchain file sets, not the host's:
          # the amd64 .pc files answering would prove nothing about the
          # cross build.
          test -f /usr/include/EGL/egl.h
          test -f /usr/include/GLES2/gl2.h
          PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig \
            pkg-config --exists egl glesv2 wayland-client xkbcommon

      # The executable appinfo.json names. Sony's Wayland client, because
      # webOS's runner template is Sony's -- the package shipped for weeks
      # naming a `dartvel_app` that was never built, so it could not have
      # launched at all. webos-window.yml is where it is proven to run.
      - name: Cross-compile the runner for ARM
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/sony/flutter-embedded-linux.git elinux-src
          cat > /tmp/armhf.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER arm-linux-gnueabihf-gcc)
          set(CMAKE_CXX_COMPILER arm-linux-gnueabihf-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/arm-linux-gnueabihf)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(ENV{PKG_CONFIG_LIBDIR} /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig)
          EOF
          cd elinux-src && cmake -E make_directory build
          cp ../engine/libflutter_engine.so build/
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/armhf.cmake \
            -DUSER_PROJECT_PATH=examples/flutter-wayland-client
          cmake --build . --config Release
          file flutter-client

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      # The kernel comes out of a Linux desktop build, and that needs GTK.
      # Without these, cmake fails in flutter/CMakeLists.txt at
      # pkg_check_modules, which reads as a Flutter problem and is a missing
      # apt package.
      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake \
            pkg-config

      # The application's Dart, compiled for ARM by the host gen_snapshot that
      # came with the engine. This is the step a static bundle cannot skip:
      # a release engine has no interpreter, so kernel will not run on it.
      - name: Compile the app to ARM AOT
        run: |
          set -euo pipefail
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel routes
          # For the asset bundle and icudtl.dat, which the package needs and
          # the kernel step does not produce.
          flutter build linux --debug

          # An AOT kernel, not a debug one.
          #
          # `flutter build bundle --release` emits no kernel_blob.bin -- a
          # release bundle is already AOT for the host -- and the debug
          # kernel_blob.bin is only the app's code: the platform comes
          # separately, so gen_snapshot aborts on it with
          # "Unable to use class Library:'dart:core' ... which is not loaded
          # yet".
          #
          # So the kernel is compiled here against the AOT platform, by the
          # frontend server Flutter ships. The patched SDK is kernel and is
          # architecture-independent, which is why the host's serves a target
          # Flutter has no toolchain for.
          FR="${FLUTTER_ROOT}"
          SDK="$FR/bin/cache/artifacts/engine/common/flutter_patched_sdk_product"

          # dartaotruntime, not dart: frontend_server_aot.dart.snapshot is an
          # AOT snapshot and refuses to run on the JIT runtime.
          "$FR/bin/cache/dart-sdk/bin/dartaotruntime" \
            "$FR/bin/cache/artifacts/engine/linux-x64/frontend_server_aot.dart.snapshot" \
            --sdk-root "$SDK/" \
            --target=flutter --aot --tfa \
            --platform "$SDK/platform_strong.dill" \
            --packages .dart_tool/package_config.json \
            --output-dill app.dill \
            lib/main.dart 2>&1 | tail -3

          test -s app.dill || {
            echo "::error::the frontend server produced no kernel"
            exit 1
          }
          ls -lh app.dill

          # Compiled by the host gen_snapshot that came with the ARM engine:
          # it runs here and emits ARM, which is why there is no architecture
          # argument to get wrong.
          "$GITHUB_WORKSPACE/engine/gen_snapshot" \
            --deterministic \
            --snapshot_kind=app-aot-elf \
            --elf=libapp.so \
            --strip \
            app.dill

          ls -l libapp.so
          file libapp.so

      - name: Assemble the webOS package
        run: |
          set -euo pipefail
          cd examples/dartvel_example
          OUT=build/webos/com.dartvel.example
          mkdir -p "$OUT/lib" "$OUT/data"
          cp -r build/linux/x64/debug/bundle/data/flutter_assets "$OUT/data/"
          cp build/linux/x64/debug/bundle/data/icudtl.dat "$OUT/data/"
          # Release is AOT: kernel would be dead weight and would imply the
          # app is debuggable when it is not.
          rm -f "$OUT/data/flutter_assets/kernel_blob.bin"
          cp "$GITHUB_WORKSPACE/engine/libflutter_engine.so" "$OUT/lib/"
          cp libapp.so "$OUT/lib/"
          # The two files appinfo.json names and the package never held.
          cp "$GITHUB_WORKSPACE/elinux-src/build/flutter-client" "$OUT/dartvel_app"
          chmod +x "$OUT/dartvel_app"
          # An 80x80 tile in the example's own purple. webOS shows the icon
          # on the home screen and refuses the package when appinfo names one
          # that is not there.
          dart "$GITHUB_WORKSPACE/tool/ci/png.dart" solid "$OUT/icon.png" 80 80 4B3B82
          dart "$GITHUB_WORKSPACE/tool/ci/webos_appinfo.dart" write "$OUT"
          find "$OUT" -maxdepth 3 | sort

      # The checks webOS reports only as a generic install failure on the
      # television, hours after the build that caused them.
      - name: The package must be one webOS would accept
        run: |
          set -euo pipefail
          cd examples/dartvel_example
          OUT=build/webos/com.dartvel.example
          test -f "$OUT/appinfo.json"
          test -f "$OUT/lib/libflutter_engine.so"
          test -f "$OUT/lib/libapp.so"
          test -d "$OUT/data/flutter_assets"
          test -f "$OUT/data/icudtl.dat"
          test ! -f "$OUT/data/flutter_assets/kernel_blob.bin"

          for lib in libflutter_engine.so libapp.so; do
            DESC=$(file -b "$OUT/lib/$lib")
            echo "$lib: $DESC"
            case "$DESC" in
              *"ARM"*) ;;
              *) echo "::error::$lib is not ARM: $DESC"; exit 1 ;;
            esac
          done

          dart "$GITHUB_WORKSPACE/tool/ci/webos_appinfo.dart" check "$OUT"

          # Through the CLI's own validator, so the check the build runs and the
          # check the tests cover are the same one. A second hand-written list
          # of paths here would drift from it.
          dart pub get --directory "$GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" \
            webos verify-package "$OUT"

          du -sh "$OUT"

      # The package has never been run. Everything above proves it assembles
      # and that the parts are ARM; none of it proves the engine starts.
      #
      # qemu-user runs 32-bit ARM binaries on this x86-64 runner, so no
      # television and no ARM runner is needed to find that out — only to find
      # out whether LG's window and input stack work, which is a different
      # question and stays open.
      - name: Install the ARM emulator and cross compiler
        run: |
          sudo apt-get install -y -qq qemu-user-static gcc-arm-linux-gnueabihf

      - name: The app must render on ARM
        # It takes about a second. A cap well above that turns a wedged probe
        # into a failure in minutes rather than one that silently eats the
        # job's whole budget and reports nothing, which is what it did once.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/examples/dartvel_example/build/webos/com.dartvel.example"
          cd "$(mktemp -d)"

          # The engine's own header. A hand copy of FlutterRendererConfig is
          # how the first attempt got kInvalidArguments: it is a union with no
          # struct_size, and the copy was a struct with one.
          curl -sSLO https://raw.githubusercontent.com/flutter/flutter/3.47.5/engine/src/flutter/shell/platform/embedder/embedder.h
          mv embedder.h flutter_embedder.h

          cp "$OUT/lib/"*.so .
          arm-linux-gnueabihf-gcc -O1 -I. -o render \
            "$GITHUB_WORKSPACE/tool/webos/render_probe.c" \
            -L. -lflutter_engine -Wl,-rpath,'$ORIGIN'

          timeout 420 qemu-arm-static -L /usr/arm-linux-gnueabihf ./render \
            "$OUT/data/flutter_assets" "$OUT/data/icudtl.dat" ./libapp.so

          test -s frame.ppm || {
            echo "::error::the engine started but presented no frame"
            exit 1
          }

          # A crash before the first frame leaves a buffer that is one colour,
          # and one colour passes every check that only stats the file. This
          # is the check that does not.
          dart "$GITHUB_WORKSPACE/tool/ci/png.dart" from-ppm frame.ppm frame.png
          dart pub get --directory "$GITHUB_WORKSPACE/packages/dartvel_cli"
          dart run "$GITHUB_WORKSPACE/packages/dartvel_cli/bin/dartvel.dart" \
            capture verify frame.png --label webos-arm

          cp frame.png frame.ppm /tmp/diag/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: webos-arm-frame
          path: /tmp/diag/frame.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: webos-package
          path: examples/dartvel_example/build/webos
          if-no-files-found: error

  # The generated worker's outbox, in a real browser. `dart test` cannot run
  # a service worker, so the generator's tests held the outbox at the source;
  # this loads the site's built worker in Chrome, takes the server away,
  # makes a POST, brings the server back and expects the POST to arrive.
  pwa-sync:
    name: pwa — queue offline and replay in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }
      - run: cargo install cbindgen --locked || true
      - name: Build the site as a PWA
        run: |
          set -euo pipefail
          cd sites/dartvel_site
          flutter pub get
          dart run dartvel_cli:dartvel build web
          # Written over Flutter's own worker, which index.html registers.
          test -f build/web/flutter_service_worker.js
          grep -q "dartvel-outbox" build/web/flutter_service_worker.js
      - name: A POST made offline is queued and replayed once online
        run: |
          set -euo pipefail
          cd sites/dartvel_site
          google-chrome --version
          dart run dartvel_cli:dartvel capture pwa-sync --web build/web --chrome "$(command -v google-chrome)"

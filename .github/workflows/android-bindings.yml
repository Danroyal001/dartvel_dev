name: Android bindings

# Generates the JNI bindings for the Android framework classes Dartvel needs,
# and commits them.
#
# This exists because Android was the one platform with no bindings at all, and
# the reason was specific: reaching a Java method from Dart needs
# ProtectedJniExtensions, which package:jni hides from its public export and
# offers only through package:jni/_internal.dart — a library whose header says
# it is for generated code. A hand-written attempt was written and removed
# rather than shipped.
#
# jnigen is the supported route, and it needs android.jar from the Android SDK.
# A runner has one; the development Codespace does not. So generation happens
# here and the output is committed.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the generated bindings back to main
        required: false
        default: 'true'

jobs:
  generate:
    name: jnigen over the Android SDK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      # The runner ships an Android SDK but sdkmanager is not on PATH, and the
      # first attempt died on "sdkmanager: command not found" before generating
      # anything. It also usually has a platform jar already, so this looks
      # before it installs.
      - uses: android-actions/setup-android@v3

      - name: Find or install a platform jar
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "sdk root: ${SDK:-<unset>}"
          ls "$SDK/platforms" 2>/dev/null || echo "(no platforms yet)"

          if [ ! -f "$SDK/platforms/android-34/android.jar" ]; then
            echo "installing platforms;android-34"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platforms;android-34" > /dev/null
          fi
          # jnigen reads this file directly; no emulator, no Gradle project.
          ls -la "$SDK/platforms/android-34/android.jar"

      - name: Generate
        id: generate
        run: |
          set -uo pipefail
          mkdir -p /tmp/diag
          exec > >(tee -a /tmp/diag/jnigen.log) 2>&1
          cd packages/dartvel_flutter
          # jnigen is a committed dev dependency; nothing to add here.
          dart pub get

          # The config carries a placeholder because the SDK path differs
          # between runner images. Substituted into a copy, so the committed
          # config stays environment-independent.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          JAR="$SDK/platforms/android-34/android.jar"
          test -f "$JAR"
          sed "s|ANDROID_JAR_PATH|$JAR|" tool/android_bindings.jnigen.yaml \
            > /tmp/jnigen.yaml
          grep -A2 "^class_path:" /tmp/jnigen.yaml

          dart run jnigen --config /tmp/jnigen.yaml
          echo "--- generated ---"
          find lib/src/platform/android/generated -name "*.dart" | head -20
          wc -l lib/src/platform/android/generated/*.dart 2>/dev/null | tail -3

      - name: It must have produced something importable
        run: |
          # A generation that emits nothing still exits zero, and the failure
          # would then appear as a missing symbol somewhere else entirely.
          test -d packages/dartvel_flutter/lib/src/platform/android/generated
          count=$(find packages/dartvel_flutter/lib/src/platform/android/generated -name "*.dart" | wc -l)
          echo "generated files: $count"
          [ "$count" -gt 0 ] || { echo "::error::jnigen produced no Dart"; exit 1; }

      - name: Analyze the generated code
        run: |
          cd packages/dartvel_flutter
          # Generated code is not exempt from compiling.
          flutter analyze --no-fatal-infos lib/src/platform/android/generated || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-bindings, path: /tmp/diag/, if-no-files-found: warn }

      - name: Commit them
        if: inputs.commit == 'true'
        run: |
          set -euo pipefail
          git config user.name "SigmaDev (Σ)"
          git config user.email "61921483+Danroyal001@users.noreply.github.com"
          git add packages/dartvel_flutter/lib/src/platform/android/generated \
                  packages/dartvel_flutter/pubspec.yaml
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          # The message is built in a file rather than inlined: a multi-line
          # -m argument inside a YAML block scalar has lines at column 0, which
          # YAML reads as new top-level keys.
          {
            echo "chore(android): regenerate JNI bindings from the Android SDK"
            echo
            echo "Generated by .github/workflows/android-bindings.yml with jnigen"
            echo "over android.jar, which the development environment does not"
            echo "have. Hand-written JNI is not supported: it needs"
            echo "ProtectedJniExtensions, which package:jni exposes only through"
            echo "_internal.dart, for generated code."
          } > /tmp/commit-message
          git commit -F /tmp/commit-message
          git push

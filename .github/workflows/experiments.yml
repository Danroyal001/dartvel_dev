name: Experiments

# The suites under experiments/. Each experiment is its own Dart package
# outside the pub workspace and every published package, so nothing else
# here runs them; tool/ci/test_matrix_check.dart watches packages/ and
# sites/ only. A suite nobody runs is the failure that check exists for, so
# this job runs every experiment that has a test/ directory, and fails when
# it finds none at all rather than passing on an empty loop.
on:
  push:
    paths:
      - 'experiments/**'
      - '.github/workflows/experiments.yml'
  pull_request:
    paths:
      - 'experiments/**'
      - '.github/workflows/experiments.yml'
  workflow_dispatch:

concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - name: Analyze and test every experiment
        run: |
          set -euo pipefail
          ran=0
          for pubspec in experiments/*/pubspec.yaml; do
            dir=$(dirname "$pubspec")
            [ -d "$dir/test" ] || continue
            echo "::group::$dir"
            (cd "$dir" && timeout 300 dart pub get && dart analyze --fatal-infos && dart format --output=none --set-exit-if-changed lib test bin && timeout 600 dart test)
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "No experiment with a test/ directory was found; refusing to pass on nothing."
            exit 1
          fi
          echo "Ran $ran experiment suite(s)."

  # experiments/dartr, the Rust port Track A starts from, held to the two
  # parity bars it has met: every case in the test data of the dart_style
  # revision Dart 3.13.3 ships, and dart analyze 3.13.3 on the analyzer
  # fixture projects. Both tests skip without their reference, so the
  # reference is installed first and a skip here would be a failure.
  dartr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.3
      - name: dart_style test data at Dart 3.13.3's dart_style_rev
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/dart_style"
          cd "$RUNNER_TEMP/dart_style"
          git fetch -q --depth 1 https://github.com/dart-lang/dart_style 39edc2d946a5d7bd1caf6f1695f366b00f7b873c
          git checkout -q FETCH_HEAD
      - name: Formatter parity
        working-directory: experiments/dartr
        env:
          DART_STYLE_DIR: ${{ runner.temp }}/dart_style
        run: |
          set -euo pipefail
          cargo test --release -p dartr_format --test format_test_data -- --nocapture 2>&1 | tee "$RUNNER_TEMP/format.log"
          if grep -q '^skipped' "$RUNNER_TEMP/format.log"; then echo "dart_style test data was not found"; exit 1; fi
      - name: Analyzer parity
        working-directory: experiments/dartr
        run: |
          set -euo pipefail
          cargo test --release -p dartr --test analyze_parity -- --nocapture 2>&1 | tee "$RUNNER_TEMP/analyze.log"
          if grep -q 'skipped: dart 3.13.3 is not on PATH' "$RUNNER_TEMP/analyze.log"; then exit 1; fi
      - name: Dart SDK 3.13.3 source for the oracles
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/dart-sdk"
          cd "$RUNNER_TEMP/dart-sdk"
          git remote add origin https://github.com/dart-lang/sdk
          git sparse-checkout set --no-cone /pubspec.yaml /pkg/analyzer/ /pkg/_fe_analyzer_shared/ /pkg/linter/
          git fetch -q --depth 1 --filter=blob:none origin refs/tags/3.13.3
          git checkout -q FETCH_HEAD
      - name: Lint and front-end differential tests
        working-directory: experiments/dartr
        env:
          DARTR_DART_SDK_SOURCE: ${{ runner.temp }}/dart-sdk
        run: |
          set -euo pipefail
          cargo test --release -p dartr --test lint_internal_errors
          cargo test --release -p dartr_lints --test differential
          cargo test --release -p dartr --test 'difftest_*'

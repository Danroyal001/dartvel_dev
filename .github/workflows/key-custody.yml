name: Key custody

# The application key in the custody each platform offers, on the platforms
# the development Codespace cannot reach: the Android Keystore on an emulator,
# the iOS Keychain on a simulator, and the macOS Keychain on a runner.
#
# The phones run a probe rather than a `flutter test` suite. `flutter test`
# uninstalls the application when it finishes, and an uninstall deletes a
# Keystore entry and a Keychain item, so "the key survives a restart" can only
# be shown by launching one installed build twice. See
# examples/dartvel_example/integration_test/app_key_custody_probe.dart and
# tool/ci/key_custody_device.dart.
#
# A workflow of its own, with a concurrency group per commit: the Tests
# workflow is cancelled by every push to main, and a verdict on key custody
# should not be thrown away because an unrelated commit landed. Bounded by
# timeouts, not by narrowing what runs; the repository is public and macOS
# minutes are free.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/dartvel_core/lib/src/crypto/**
      - packages/dartvel_core/test/app_key_*
      - packages/dartvel_flutter/lib/src/platform/android/android_keystore*
      - packages/dartvel_flutter/lib/src/platform/webcrypto_key_store_io.dart
      - examples/dartvel_example/integration_test/app_key_custody_probe.dart
      - tool/ci/key_custody_device.dart
      - .github/workflows/key-custody.yml

concurrency:
  group: key-custody-${{ github.sha }}
  cancel-in-progress: false

jobs:
  macos-keychain:
    name: macOS Keychain store
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }
      # An unsigned `dart test` process: the login keychain, round-trip,
      # replace in place, the item's attributes read back from the Keychain,
      # and the custody rules that are the same on every host.
      - name: The Keychain store and the custody rules
        working-directory: packages/dartvel_core
        run: |
          dart pub get
          dart test test/app_key_store_test.dart test/app_key_custody_test.dart --reporter expanded

  ios-simulator:
    name: iOS Keychain on a simulator, across a restart
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Generate the client
        working-directory: examples/dartvel_example
        run: |
          set -euo pipefail
          flutter pub get
          dart run dartvel_cli:dartvel routes

      - name: Build the probe for the simulator
        working-directory: examples/dartvel_example
        run: |
          set -euo pipefail
          flutter build ios --debug --simulator -t integration_test/app_key_custody_probe.dart 2>&1 \
            | tee /tmp/diag/ios-build.log
          test -d build/ios/iphonesimulator/Runner.app

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available | head -30
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [0-9]+[^(]*\(([-A-F0-9]+)\)" | grep -oE "[-A-F0-9]{36}")
          echo "device: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Launch twice and read the same key back
        timeout-minutes: 15
        run: >-
          dart tool/ci/key_custody_device.dart ios
          "${{ steps.sim.outputs.device }}"
          examples/dartvel_example/build/ios/iphonesimulator/Runner.app

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: key-custody-ios, path: /tmp/diag/, if-no-files-found: warn }

  android-emulator:
    name: Android Keystore on an emulator, across a restart
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.5', channel: stable, cache: true }

      # Without the udev rule the emulator falls back to software rendering
      # and times out rather than failing outright.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      # Through `dartvel build android` first: it writes the Context provider
      # every Android binding reaches the Context through, and the Keystore
      # store needs that Context for its no-backup directory. A plain
      # `flutter build apk` of an ungenerated project has no provider, and
      # the store would refuse -- correctly, and uselessly for this job.
      - name: Build the probe APK
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/android-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel build android --profile development
          flutter build apk --debug -t integration_test/app_key_custody_probe.dart
          ls -la build/app/outputs/flutter-apk/

      - name: Launch twice on an emulator
        id: run
        continue-on-error: true
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # One line: the action runs each line as its own `sh -c`.
          script: dart tool/ci/key_custody_device.dart android

      # The step above is continue-on-error so its diagnostics upload; this
      # reads what it decided. No verdict is a failure too.
      - name: The device agreed
        run: |
          set -euo pipefail
          test -f /tmp/diag/key-custody-android-verdict.txt \
            || { echo "no verdict: the device run did not finish"; exit 1; }
          cat /tmp/diag/key-custody-android-verdict.txt
          head -1 /tmp/diag/key-custody-android-verdict.txt | grep -qx passed

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: key-custody-android, path: /tmp/diag/, if-no-files-found: warn }

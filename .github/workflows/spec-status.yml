name: Spec status

# Checks that docs/spec-status.json still describes NEW_SPEC.md and the tree:
# every section labelled, no label naming a section that no longer exists, and
# every "Partial" or "Shipped" claim citing evidence that is actually present.
#
# Unlike the platform build matrix this runs on every push, because it is a
# Linux job that finishes in seconds and the whole point of the labels is that
# something checks them — an unchecked status index is the drift it replaced.

# The path filter this used to carry was the bug. It triggered only on changes
# to NEW_SPEC.md, the index, or the checker — but the index cites evidence
# living under packages/, so deleting a test file invalidates it without
# touching any of those. That is exactly what happened when computed_test.dart
# was renamed: a dangling citation shipped, and no push-triggered job was
# watching. The check runs in seconds; filtering it was a false economy.
on:
  push:
  pull_request:
  workflow_dispatch:

# A push that lands while this is running supersedes it. Without this the runs
# queue and every one of them finishes against a branch that has already moved
# on -- which is not a cost problem, it is a feedback one: the answer arrives
# for a commit nobody is looking at any more.
concurrency:
  group: spec-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart run tool/spec_status_check.dart

      # And whether anything calls what those files declare. Citing a file
      # that exists is a low bar: the page policy guard, the cron scheduler
      # and the lifecycle setters each cleared it while doing nothing at
      # all -- correct code, unit-tested against its own return value,
      # recorded as shipped, never wired.
      #
      # dart, not dart run: this imports only dart: libraries, so it needs
      # no package resolution.
      - run: dart tool/ci/spec_coverage_check.dart
      - run: dart tool/ci/evidence_reachable_check.dart
      # An annotation argument nobody reads is the shape of nearly every gap
      # this repository has had: accepted, built, and doing nothing.
      - run: dart tool/ci/annotation_read_check.dart
      # A suite nobody runs and a job whose package is not there both leave
      # the run green. Both have happened here: dartvel_windowing was added
      # without a job, and dartvel_dev's job pointed at the name the package
      # had before it was renamed, so bash could not start and it read as an
      # infrastructure fault. The workflow's own comments record them, and a
      # rule nothing checks drifts back.
      - run: dart tool/ci/test_matrix_check.dart

      # Cheap, and it catches a class of break that reads as flakiness. A
      # pubspec naming an asset directory that git cannot track builds fine on
      # every machine that has ever run it and fails on every fresh checkout,
      # so it shows up as one target failing among twenty rather than as a
      # broken pubspec.
      - run: dart run tool/pubspec_paths_check.dart

      # The site's feature page says of itself that it lists every section the
      # index records as Shipped and nothing else. It listed 29 of 40 under a
      # heading that said thirty-three, because nothing compared them.
      - run: dart run tool/site_features_check.dart

      # This repository is Dart, tooling included, and it has drifted back
      # more than once: a workflow reaches for a python3 heredoc because the
      # script is six lines, and the language breakdown of a project sold as
      # "Flutter's Laravel" then says Python. A rule nothing checks drifts.
      - run: dart run tool/ci/no_python_check.dart

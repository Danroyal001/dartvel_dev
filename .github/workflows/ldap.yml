# The LDAP client against a real OpenLDAP.
#
# Nearly every mistake in BER produces a directory that closes the connection
# with no explanation, so a client that agrees with its own decoder proves
# almost nothing. The encoding tests pin the bytes; this shows a server accepts
# them.
#
# Two of the assertions matter more than the happy path, because both
# *authenticate* when the code is wrong: a bind with an empty password, which
# many directories answer as an anonymous bind and therefore with success, and
# a username containing filter metacharacters, which rewrites the search rather
# than failing it.
name: ldap

on:
  push:
    paths:
      - 'packages/dartvel_core/lib/src/auth/ldap.dart'
      - 'packages/dartvel_core/test/ldap_*'
      - '.github/workflows/ldap.yml'
  workflow_dispatch:

jobs:
  openldap:
    name: OpenLDAP — bind, search, and the ways in
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # osixia rather than bitnami: Bitnami's images were withdrawn from the
    # public registry, and `bitnami/openldap:2.6` no longer resolves at all.
    services:
      openldap:
        image: osixia/openldap:1.5.0
        ports:
          - 389:389
        env:
          LDAP_ORGANISATION: Dartvel
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: adminpassword

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }

      - name: Resolve
        working-directory: packages/dartvel_core
        run: dart pub get

      - name: The directory is actually up
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ldap-utils
          for i in $(seq 1 30); do
            if ldapsearch -x -H ldap://localhost:389 \
                 -D "cn=admin,dc=example,dc=org" -w adminpassword \
                 -b "dc=example,dc=org" -s base dn >/dev/null 2>&1; then
              echo "openldap is serving"
              exit 0
            fi
            sleep 3
          done
          echo "::error::OpenLDAP never answered"
          exit 1

      # This image seeds no users, so the fixtures are added here. The suite
      # authenticates as ada/lovelace and needs grace only to prove a search
      # returns one entry rather than everything.
      - name: Seed the users the suite expects
        run: |
          set -euo pipefail
          cat > /tmp/seed.ldif <<'LDIF'
          dn: ou=users,dc=example,dc=org
          objectClass: organizationalUnit
          ou: users

          dn: uid=ada,ou=users,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: ada
          cn: Ada Lovelace
          sn: Lovelace
          mail: ada@example.org
          userPassword: lovelace

          dn: uid=grace,ou=users,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: grace
          cn: Grace Hopper
          sn: Hopper
          mail: grace@example.org
          userPassword: hopper
          LDIF
          ldapadd -x -H ldap://localhost:389 \
            -D "cn=admin,dc=example,dc=org" -w adminpassword -f /tmp/seed.ldif
          # Proves the fixture landed, so a later failure is the client's
          # rather than the seeding's.
          ldapsearch -x -H ldap://localhost:389 \
            -D "cn=admin,dc=example,dc=org" -w adminpassword \
            -b "dc=example,dc=org" "(uid=ada)" dn | grep "uid=ada"

      - name: Bind and search through the client
        working-directory: packages/dartvel_core
        env:
          DARTVEL_LDAP_HOST: localhost
          DARTVEL_LDAP_PORT: '389'
          DARTVEL_LDAP_BASE: dc=example,dc=org
          DARTVEL_LDAP_ADMIN: cn=admin,dc=example,dc=org
          DARTVEL_LDAP_PASSWORD: adminpassword
        run: dart test test/ldap_live_test.dart

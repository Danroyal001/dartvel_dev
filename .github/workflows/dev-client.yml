name: Dev client

# A development build on a device, paired with `dartvel dev`.
#
# Android: an emulator installs `dartvel build android --profile development`,
# pairs by the dartvel-dev:// link the dev server prints, shows an edit made
# after the APK was built, then shows a second edit saved while paired --
# without reinstalling, in the same process. See
# tool/ci/android_dev_client_check.dart.
#
# A workflow of its own with a concurrency group per commit, so a verdict is
# not cancelled by an unrelated push. The repository is public, so minutes
# are free; the jobs are bounded by timeouts, not by narrowing what runs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/dartvel_cli/lib/src/devclient/**
      - packages/dartvel_cli/lib/src/commands/dev_command.dart
      - packages/dartvel_cli/lib/src/commands/build_command.dart
      - packages/dartvel_core/lib/src/devclient/**
      - packages/dartvel_core/lib/src/updates/**
      - packages/dartvel_flutter/lib/src/devclient/**
      - packages/dartvel_flutter/lib/src/updates/**
      - tool/ci/android_dev_client_check.dart
      - tool/ci/ios_dev_client_check.dart
      - tool/ci/linux_dev_client_check.dart
      - tool/ci/desktop_dev_client_check.dart
      - packages/dartvel_flutter/lib/src/windowing/app_launch.dart
      - .github/workflows/dev-client.yml

concurrency:
  group: dev-client-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-emulator:
    name: Android — pair, edit, hot reload
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      # Without the udev rule the emulator falls back to software rendering
      # and times out rather than failing outright.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Build the development APK
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/devclient-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel build android --profile development
          ls -la build/app/outputs/flutter-apk/
          # What the development profile writes. A build that skipped it is a
          # debug APK that can never pair, and the device step would time out
          # saying so far less clearly.
          test -f android/app/src/debug/java/dev/dartvel/devclient/DartvelDevTunnel.java
          test -f .dart_tool/dartvel/development_main.dart
          grep -q 'android:scheme="dartvel-dev"' android/app/src/debug/AndroidManifest.xml

      # Flutter's attach compiles with the flutter-tester device's toolchain;
      # fetched here rather than halfway through the device step's timeout.
      - name: Precache the tester artifacts
        run: flutter precache --linux

      - name: Pair, edit and reload on an emulator
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # One line: the action runs each line as its own `sh -c`.
          script: dart tool/ci/android_dev_client_check.dart

      - name: The device agreed
        run: |
          set -euo pipefail
          test -f /tmp/diag/devclient-verdict.txt \
            || { echo "no verdict: the device check did not finish"; exit 1; }
          cat /tmp/diag/devclient-verdict.txt
          head -1 /tmp/diag/devclient-verdict.txt | grep -qx passed

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: dev-client-android, path: /tmp/diag/, if-no-files-found: warn }

  # iOS: the same loop on a simulator. The built app must declare the
  # dartvel-dev scheme; the link is then given at launch, because `simctl
  # openurl` raises a confirmation nothing on a runner can answer. The
  # Objective-C tunnel pairs over TLS pinned to the key in the link. See
  # tool/ci/ios_dev_client_check.dart. A physical iPhone does not start a
  # debug build from the home screen without a debugger attached; the
  # simulator has no such limit.
  ios-simulator:
    name: iOS simulator — pair, edit, hot reload
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Build the development app for the simulator
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/ios-devclient-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel build ios --profile development --simulator
          app=build/ios/iphonesimulator/Runner.app
          test -d "$app"
          # What the development profile writes, and that Xcode can read it.
          test -f ios/Runner/DartvelDevClient.m
          plutil -lint ios/Runner.xcodeproj/project.pbxproj ios/Runner/Info-Development.plist
          /usr/libexec/PlistBuddy -c 'Print CFBundleURLTypes' "$app/Info.plist" | grep -q dartvel-dev
          # The tunnel is compiled in, where Dart's FFI lookup can find it.
          found=""
          for image in "$app/Runner" "$app/Runner.debug.dylib"; do
            [ -f "$image" ] && nm -gU "$image" | grep -q _dartvel_dev_client_vm_service && found="$image"
          done
          test -n "$found" || { echo "::error::dartvel_dev_client_vm_service is not exported"; exit 1; }
          echo "tunnel exported from $found"

      # Flutter's attach compiles with the flutter-tester device's toolchain;
      # fetched here rather than halfway through the device step's timeout.
      - name: Precache the tester artifacts
        run: flutter precache --macos

      - name: Pair, edit and reload on a simulator
        id: run
        continue-on-error: true
        timeout-minutes: 40
        run: dart tool/ci/ios_dev_client_check.dart

      - name: The simulator agreed
        run: |
          set -euo pipefail
          test -f /tmp/diag/ios-devclient-verdict.txt \
            || { echo "no verdict: the simulator check did not finish"; exit 1; }
          cat /tmp/diag/ios-devclient-verdict.txt
          head -1 /tmp/diag/ios-devclient-verdict.txt | grep -qx passed

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: dev-client-ios, path: /tmp/diag/, if-no-files-found: warn }

  # Linux desktop: a development build launched with the pairing link as its
  # launch flag, under a virtual display. The C++ tunnel pairs over GIO TLS
  # pinned to the key in the link. See tool/ci/linux_dev_client_check.dart.
  linux-desktop:
    name: Linux desktop — launch with the link, edit, hot reload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      # glib-networking is GIO's TLS; without it the tunnel says so and never
      # pairs.
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev glib-networking xvfb

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Build the development app
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/linux-devclient-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel build linux --profile development --no-auto-install
          binary=build/linux/x64/debug/bundle/dartvel_example
          test -x "$binary"
          grep -q 'dartvel_dev_client.cc' linux/runner/CMakeLists.txt
          # Exported, where Dart's FFI lookup finds it.
          nm -D --defined-only "$binary" | grep -q dartvel_dev_client_vm_service

      - name: Precache the tester artifacts
        run: flutter precache --linux

      - name: Launch with the link, edit and reload
        id: run
        continue-on-error: true
        timeout-minutes: 40
        run: dart tool/ci/linux_dev_client_check.dart

      - name: The desktop app agreed
        run: |
          set -euo pipefail
          test -f /tmp/diag/linux-devclient-verdict.txt \
            || { echo "no verdict: the desktop check did not finish"; exit 1; }
          cat /tmp/diag/linux-devclient-verdict.txt
          head -1 /tmp/diag/linux-devclient-verdict.txt | grep -qx passed

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: dev-client-linux, path: /tmp/diag/, if-no-files-found: warn }

  # macOS desktop: the development app run on the runner and launched with the
  # pairing link, which the Objective-C tunnel reads from its arguments. Its
  # sandbox allows the outgoing connection through the Debug entitlements the
  # build writes. See tool/ci/desktop_dev_client_check.dart.
  macos-desktop:
    name: macOS desktop — launch with the link, edit, hot reload
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Build the development app
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/macos-devclient-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel build macos --profile development
          app=build/macos/Build/Products/Debug/dartvel_example.app
          test -d "$app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleURLTypes' "$app/Contents/Info.plist" | grep -q dartvel-dev
          codesign -d --entitlements - "$app" 2>/dev/null | grep -q network.client
          nm -gU "$app"/Contents/MacOS/* 2>/dev/null | grep -q _dartvel_dev_client_vm_service

      - name: Precache the tester artifacts
        run: flutter precache --macos

      - name: Launch with the link, edit and reload
        id: run
        continue-on-error: true
        timeout-minutes: 40
        run: dart tool/ci/desktop_dev_client_check.dart macos

      - name: The desktop app agreed
        run: |
          set -euo pipefail
          test -f /tmp/diag/macos-devclient-verdict.txt \
            || { echo "no verdict: the desktop check did not finish"; exit 1; }
          cat /tmp/diag/macos-devclient-verdict.txt
          head -1 /tmp/diag/macos-devclient-verdict.txt | grep -qx passed

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: dev-client-macos, path: /tmp/diag/, if-no-files-found: warn }

  # Windows desktop: the development app launched with the pairing link. The
  # C++ tunnel pairs over Schannel TLS pinned to the key in the link. The
  # repository is public, so the Windows runner costs nothing; the job is
  # bounded by its timeout. See tool/ci/desktop_dev_client_check.dart.
  windows-desktop:
    name: Windows desktop — launch with the link, edit, hot reload
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /c/diag
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Build the development app
        run: |
          set -euo pipefail
          exec > >(tee -a /c/diag/windows-devclient-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel build windows --profile development --no-auto-install
          test -f build/windows/x64/runner/Debug/dartvel_example.exe
          grep -q 'dartvel_dev_client.cpp' windows/runner/CMakeLists.txt

      - name: Precache the tester artifacts
        run: flutter precache --windows

      - name: Launch with the link, edit and reload
        id: run
        continue-on-error: true
        timeout-minutes: 45
        run: dart tool/ci/desktop_dev_client_check.dart windows

      - name: The desktop app agreed
        run: |
          set -euo pipefail
          test -f /c/diag/windows-devclient-verdict.txt \
            || { echo "no verdict: the desktop check did not finish"; exit 1; }
          cat /c/diag/windows-devclient-verdict.txt
          head -1 /c/diag/windows-devclient-verdict.txt | tr -d '\r' | grep -qx passed

      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: dev-client-windows, path: C:\diag, if-no-files-found: warn }

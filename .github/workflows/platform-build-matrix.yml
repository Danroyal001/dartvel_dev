name: Platform build matrix

# Verifies `dartvel build <platform>` on the hosts this repository's development
# machines cannot provide. Windows desktop needs Windows, and the Apple targets
# need macOS — Flutter has no desktop cross-compilation, so these are the only
# places these targets can genuinely be proven.
#
# Manually triggered on purpose. This is a public repository, so standard
# runners are free — but a full matrix still takes real wall-clock time and is
# rarely more informative than running it deliberately.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Which targets to build
        type: choice
        default: all
        options: [all, windows, apple, embedded, macos, ios, tvos, tizen, webos, sony-elinux, fuchsia, linux]
      timeout:
        description: >-
          Minutes before a job is killed. A successful build takes under ten;
          anything approaching this is hung.
        type: string
        default: '45'

env:
  FLUTTER_VERSION: 3.44.5

jobs:
  build:
    name: dartvel build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # Gated in a step rather than at the job level: `matrix` is not available
    # in a job-level `if`, which is evaluated before the matrix expands. A
    # skipped job still starts a runner, which mattered when this repository
    # was private and billed; it is a public repository now, so standard
    # runners are free and the waste is a few seconds rather than money.
    if: always()
    # `fail-fast: false` below is what keeps one failing target from cancelling
    # the others. `continue-on-error: true` used to be set here as well, and it
    # was actively harmful: it rewrites a job's conclusion to success even when
    # a step failed, so `dartvel build fuchsia` skipping and failing the
    # artifact check was reported as a green job.
    # A build that hangs is the failure mode worth guarding, not one that
    # breaks: a silently blocked `dartvel build macos` once ran to GitHub's
    # 6-hour default having printed nothing after "Building for macos...".
    # A successful job here takes under ten minutes.
    timeout-minutes: ${{ fromJSON(inputs.timeout || '45') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, group: windows }
          - { os: macos-latest, platform: macos, group: apple }
          - { os: macos-latest, platform: ios, group: apple }
          - { os: macos-latest, platform: tvos, group: apple }
          # Embedded and desktop Linux targets. All build on the cheapest,
          # most plentiful runner, and none of them were covered before —
          # `tizen` was verified once on a laptop, and `fuchsia` had never
          # been executed anywhere at all.
          - { os: ubuntu-latest, platform: linux, group: embedded }
          - { os: ubuntu-latest, platform: tizen, group: embedded }
          - { os: ubuntu-latest, platform: webos, group: embedded }
          - { os: ubuntu-latest, platform: sony-elinux, group: embedded }
          - { os: ubuntu-latest, platform: fuchsia, group: embedded }

    steps:
      - name: Skip target not selected
        id: gate
        shell: bash
        run: |
          selected='${{ inputs.targets }}'
          if [ "$selected" = "all" ] || [ "$selected" = "${{ matrix.group }}" ] \
             || [ "$selected" = "${{ matrix.platform }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping ${{ matrix.platform }} (selected: $selected)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.run == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # tvOS is not an iOS build: it goes through the community flutter-tvos
      # embedder (Dartvel fork), which carries its own Flutter SDK and
      # origin-signed engine artifacts. Runners have no signing team, so the
      # build below uses the simulator profile — the only unsigned path.
      - name: Install flutter-tvos embedder
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'tvos'
        run: |
          git clone --depth 1 https://github.com/Danroyal001/dartvel_tvos.git "$HOME/dartvel_tvos"
          echo "$HOME/dartvel_tvos/bin" >> "$GITHUB_PATH"
          "$HOME/dartvel_tvos/bin/flutter-tvos" precache
          "$HOME/dartvel_tvos/bin/flutter-tvos" doctor || true

      # Setup is most of a short run's budget, and all of it is cacheable.
      # Measured on run 32201351600: 69s installing cbindgen and ~2m36s
      # compiling the Rust runtime, against 3m of actual Xcode build before
      # the cap. At the macOS 10x multiplier that setup costs more than the
      # build it exists to enable.
      - name: Cache cbindgen
        id: cbindgen-cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ runner.os }}-${{ runner.arch }}

      # dartvel_shelf's build hook compiles the Rust runtime and then runs
      # cbindgen over it. Runners ship cargo but not cbindgen, and the hook
      # treats a missing cbindgen as a hard error (unlike a missing cargo,
      # which it skips), so it has to be installed explicitly.
      - name: Install cbindgen
        if: steps.gate.outputs.run == 'true' && steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --locked

      # Keyed on the Rust sources and manifest, so a cache hit is only ever a
      # build of the same crate — a stale hit would be worse than no cache.
      - name: Cache the Rust runtime build
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            packages/dartvel_shelf/rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            dartvel-shelf-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('packages/dartvel_shelf/rust/Cargo.toml',
                      'packages/dartvel_shelf/rust/Cargo.lock',
                      'packages/dartvel_shelf/rust/src/**') }}
          restore-keys: dartvel-shelf-${{ runner.os }}-${{ runner.arch }}-

      # Linux desktop needs GTK; the embedders need it too once they reach a
      # Flutter build. Cheap on a runner, and skipped everywhere else.
      - name: Install Linux build dependencies
        if: steps.gate.outputs.run == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake pkg-config

      # Fuchsia's embedder is a Bazel workspace rather than a Flutter CLI
      # wrapper, so it needs Bazel before `dartvel build fuchsia` can reach it.
      - name: Install Bazel for Fuchsia
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'fuchsia'
        run: |
          set -euo pipefail
          sudo curl -fsSLo /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Resolve dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: examples/dartvel_example
        run: flutter pub get

      # macOS hangs after "Building for macos..." with no output at all — not
      # even Flutter's own first line — and no xcodebuild among the orphaned
      # processes, so Flutter never reaches Xcode.
      #
      # Previous attempts only established *that* it stopped. This establishes
      # *what it is doing* while stopped: the build runs unbounded in the
      # background, and once it has had time to wedge, `sample` captures a
      # stack for every dart and flutter process alive. A wedged process has a
      # stack, and the stack names the syscall it is parked in — a lock, a
      # read, a wait — which is the thing no amount of log-staring can produce.
      #
      # Never fails the job. It exists to produce evidence.
      - name: Diagnose the macOS hang
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'macos'
        working-directory: examples/dartvel_example
        continue-on-error: true
        timeout-minutes: 16
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/diagnostics"
          # Unbounded on purpose: the point is to catch it mid-hang, not to
          # let Dartvel kill it before it can be sampled.
          dart run dartvel_cli:dartvel build macos --auto-install \
            --build-timeout 0 > "$RUNNER_TEMP/diagnostics/hang-build.log" 2>&1 &
          build_pid=$!

          # Long enough that a healthy build would have finished; short enough
          # to leave room for sampling inside the step timeout.
          sleep 600

          if ! kill -0 "$build_pid" 2>/dev/null; then
            echo "build finished on its own; nothing to sample"
            tail -40 "$RUNNER_TEMP/diagnostics/hang-build.log"
            exit 0
          fi

          echo "still running after 10 minutes; sampling"
          ps aux | grep -Ei 'dart|flutter|xcodebuild' | grep -v grep \
            > "$RUNNER_TEMP/diagnostics/hang-processes.txt"
          cat "$RUNNER_TEMP/diagnostics/hang-processes.txt"

          for pid in $(pgrep -f 'dartvm|dart |flutter' | head -6); do
            out="$RUNNER_TEMP/diagnostics/sample-$pid.txt"
            echo "=== sampling $pid ==="
            ps -p "$pid" -o pid=,command= | cut -c1-200
            sample "$pid" 3 -file "$out" >/dev/null 2>&1
            # The blocked frames are what matter, not the whole tree.
            grep -A 4 -iE 'Binary Images|Call graph|\?\?\?|read|wait|lock|poll' \
              "$out" 2>/dev/null | head -40
          done

          kill "$build_pid" 2>/dev/null
          echo "--- tail of the hung build ---"
          tail -30 "$RUNNER_TEMP/diagnostics/hang-build.log"

      - name: Build
        if: steps.gate.outputs.run == 'true'
        working-directory: examples/dartvel_example
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.platform }}" = "tvos" ]; then
            extra="--device-profile simulator"
          fi
          set -o pipefail
          # Bounded well inside the job cap, so a stall is reported by Dartvel
          # with the command it ran rather than as a cancelled job with no
          # explanation.
          dart run dartvel_cli:dartvel build ${{ matrix.platform }} $extra \
            --auto-install --build-timeout 20 \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # Proves an artifact exists rather than trusting the command's exit
      # code — and for tvOS, that the artifact is a tvOS app, not an iPhone
      # app that skipped signing. `dartvel build tvos` skipping because the
      # embedder is missing must fail here, not pass silently.
      - name: Verify artifact
        id: artifact
        if: steps.gate.outputs.run == 'true'
        shell: bash
        working-directory: examples/dartvel_example
        run: |
          case "${{ matrix.platform }}" in
            windows) path=build/windows/x64/runner/Release ;;
            macos)   path=build/macos/Build/Products/Release ;;
            ios)     path=build/ios/iphoneos ;;
            tvos)
              path=$(find build -type d \( -path '*appletvsimulator*' -o -path '*appletvos*' \) -name '*.app' -print -quit)
              path=${path:-build/tvos-missing} ;;
            linux)   path=build/linux/x64/release/bundle ;;
            tizen)   path=build/tizen/tpk ;;
            webos)   path=build/webos ;;
            sony-elinux) path=build/elinux ;;
            # The Fuchsia package is a .far produced inside the embedder's
            # bazel-out, not under the app's build/ directory. Verifying the
            # app's build/ would pass on an empty directory.
            fuchsia)
              far=$(find -L "$HOME/.dartvel/toolchains/dartvel_fuchsia/bazel-out" \
                -name '*.far' -print -quit 2>/dev/null)
              if [ -z "$far" ]; then
                echo "::error::no .far produced for fuchsia"
                exit 1
              fi
              echo "fuchsia package: $far"
              ls -la "$far"
              exit 0 ;;
          esac

          # Tizen Studio is licence-gated, so Dartvel must never install it and
          # a runner can never build a TPK. The pass condition here is that it
          # skipped *for that reason and said so* — a skip with no explanation,
          # or one blamed on something else, is still a failure. Every other
          # target must produce a real artifact; a skip is a failure there.
          if [ "${{ matrix.platform }}" = "tizen" ]; then
            log="$RUNNER_TEMP/build.log"
            if grep -q 'Skipping tizen' "$log" && grep -q 'Tizen Studio SDK' "$log"; then
              echo "::notice::tizen skipped as expected — the SDK is licence-gated"
              exit 0
            fi
            echo "::error::tizen did not skip for the documented licence reason"
            exit 1
          fi

          if [ ! -d "$path" ] || [ -z "$(ls -A "$path")" ]; then
            echo "::error::no artifact at $path"
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "artifact at $path:"
          ls -la "$path"

      # Diagnostics as an artifact, not only as job logs.
      #
      # The Actions *logs* endpoint has its own abuse throttle, separate from
      # the API rate limit, and it refuses reads for long stretches after a
      # burst — which is exactly when a failing build most needs reading.
      # Artifacts download through a different endpoint, so a failure stays
      # readable. Always runs, since the interesting case is the failing one.
      - name: Collect diagnostics
        if: steps.gate.outputs.run == 'true' && always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/diagnostics/" 2>/dev/null || true
          cp /tmp/plain-flutter.log "$RUNNER_TEMP/diagnostics/" 2>/dev/null || true
          {
            echo "platform: ${{ matrix.platform }}"
            echo "runner: ${{ matrix.os }}"
            echo "flutter: $(flutter --version 2>&1 | head -1)"
            echo "--- processes still alive ---"
            ps aux | grep -Ei 'dart|flutter|xcodebuild|cargo' | grep -v grep || true
          } > "$RUNNER_TEMP/diagnostics/environment.txt" 2>&1

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true' && always()
        with:
          name: diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/diagnostics
          retention-days: 5
          if-no-files-found: warn

      # Only the verified artifact: uploading all of build/ ships gigabytes
      # of intermediates against a storage quota measured in megabytes.
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true' && matrix.platform != 'tizen'
        with:
          name: dartvel-${{ matrix.platform }}
          path: examples/dartvel_example/${{ steps.artifact.outputs.path }}
          retention-days: 2
          if-no-files-found: warn

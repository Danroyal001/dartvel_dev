name: OTA updates

# DV.Updates in a real release build, end to end, with no Shorebird account.
#
# Everything a project would run: the example's shorebird.yaml points base_url
# at its own web-server binary (`dartvel build web-server`), which serves the
# Shorebird patch source because base_url names it. `dartvel updates release
# --patch-source` builds the release with Shorebird's Flutter at the version
# Dartvel pins and keeps its compiled Dart; the probe string is changed; and
# `dartvel updates patch --patch-source` builds again, diffs with Shorebird's
# patch tool for that engine, and publishes into the running binary with its
# token. On an emulator the release checks, applies through DV.Updates, and is
# the patch on the next launch. See tool/ci/android_ota_check.dart.
#
# Repository secrets are empty, so Shorebird's hosted service is not used and
# cannot be: this is the self-hosted path.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/dartvel_core/lib/src/updates/**
      - packages/dartvel_flutter/lib/src/updates/**
      - packages/dartvel_cli/lib/src/updates/**
      - packages/dartvel_cli/lib/src/commands/updates_command.dart
      - packages/dartvel_cli/lib/src/build/server_binary.dart
      - examples/dartvel_example/integration_test/app_updates_probe.dart
      - tool/ci/android_ota_check.dart
      - .github/workflows/ota-updates.yml

concurrency:
  group: ota-updates-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-emulator:
    name: Android — release, patch into the web-server binary, relaunch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DARTVEL_UPDATES_TOKEN: ci-ota-token-not-a-secret
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: Point the example's updates at its own server
        working-directory: examples/dartvel_example
        run: |
          set -euo pipefail
          # The patch source is the dev machine as the emulator sees it, and
          # DV.Updates decides when to check, so the engine must not.
          printf 'app_id: dartvel-example-ota\nbase_url: http://10.0.2.2:9090/updates\nauto_update: false\n' \
            > shorebird.yaml
          sed -i 's|^    - assets/$|    - assets/\n    - shorebird.yaml|' pubspec.yaml
          grep -n 'shorebird.yaml' pubspec.yaml
          # A release manifest has no INTERNET permission -- Flutter's template
          # puts it in the debug and profile manifests only. dartvel updates
          # release refuses a manifest without it.
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$manifest" \
            || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$manifest"
          grep -n 'android.permission.INTERNET' "$manifest"

      - name: Build the web-server binary and start it
        working-directory: examples/dartvel_example
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/web-server-build.log) 2>&1
          flutter pub get
          dart run dartvel_cli:dartvel build web-server --no-auto-install
          test -x build/server
          # Alone, as it is deployed: a copy in a directory of its own.
          mkdir -p /tmp/ota-server
          cp build/server /tmp/ota-server/server
          (cd /tmp/ota-server && DARTVEL_PORT=9090 nohup ./server > /tmp/diag/web-server.log 2>&1 &)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' \
              -d '{"app_id":"dartvel-example-ota","release_version":"0+0","platform":"android","arch":"x86_64"}' \
              http://127.0.0.1:9090/updates/api/v1/patches/check || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "patch check answered $code"
          test "$code" = 200

      - name: Release with dartvel updates release
        working-directory: examples/dartvel_example
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/ota-release.log) 2>&1
          dart run dartvel_cli:dartvel updates release --platform android \
            --patch-source http://127.0.0.1:9090/updates \
            -- --target-platform android-x64 -t integration_test/app_updates_probe.dart
          mkdir -p /tmp/ota
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/ota/release.apk
          ls -R .dartvel/updates/releases

      - name: Patch with dartvel updates patch, into the running binary
        working-directory: examples/dartvel_example
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/ota-patch.log) 2>&1
          probe=integration_test/app_updates_probe.dart
          sed -i "s/'OTA-PROBE-ONE';/'OTA-PROBE-TWO';/" "$probe"
          grep -q "'OTA-PROBE-TWO';" "$probe"
          dart run dartvel_cli:dartvel updates patch --platform android \
            --patch-source http://127.0.0.1:9090/updates \
            -- --target-platform android-x64 -t "$probe"
          find /tmp/ota-server/dartvel_data/updates -type f | tee /tmp/diag/published.txt
          grep -q 'x86_64/1/patch.bin$' /tmp/diag/published.txt

      - name: Resolve the repository for the device check
        run: dart pub get

      - name: Release, patch and relaunch on an emulator
        id: run
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: dart tool/ci/android_ota_check.dart

      - name: The device agreed
        run: |
          set -euo pipefail
          test -f /tmp/diag/ota-verdict.txt \
            || { echo "no verdict: the device check did not finish"; exit 1; }
          cat /tmp/diag/ota-verdict.txt
          head -1 /tmp/diag/ota-verdict.txt | grep -qx passed

      - name: Stop the server
        if: always()
        run: pkill -f /tmp/ota-server/server || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ota-updates-android, path: /tmp/diag/, if-no-files-found: warn }

  # iOS, as far as it goes without a signing team. A Shorebird patch runs only
  # on a physical arm64 device (its interpreter is not built for the
  # simulator) and installing either build on one needs a provisioning
  # profile; neither is available here. What can be shown is shown: the
  # development profile builds, and a release made with Shorebird's engine
  # carries the updater symbols DV.Updates binds and the shorebird.yaml it
  # reads.
  ios-release:
    name: iOS — development build, and the updater in a Shorebird release
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      SHOREBIRD_FLUTTER_BRANCH: flutter_release/3.44.5
    steps:
      - name: Open the diagnostics directory
        run: mkdir -p /tmp/diag
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      - name: The development profile builds for iOS
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/ios-development-build.log) 2>&1
          cd examples/dartvel_example
          flutter pub get
          dart run dartvel_cli:dartvel build ios --profile development
          test -d build/ios/iphoneos/Runner.app
          # A debug build's Dart is a JIT kernel, which is what dartvel publish
          # refuses for store tracks.
          find build/ios/iphoneos/Runner.app -name kernel_blob.bin | grep -q .

      - name: A Shorebird release carries the updater DV.Updates binds
        run: |
          set -euo pipefail
          exec > >(tee -a /tmp/diag/ios-shorebird-build.log) 2>&1
          git clone --filter=tree:0 -b "$SHOREBIRD_FLUTTER_BRANCH" \
            https://github.com/shorebirdtech/flutter /tmp/sbflutter
          export FLUTTER_STORAGE_BASE_URL=https://download.shorebird.dev
          SB=/tmp/sbflutter/bin/flutter
          cd examples/dartvel_example
          printf 'app_id: dartvel-example-ota\nbase_url: https://updates.example.invalid/updates\nauto_update: false\n' \
            > shorebird.yaml
          sed -i '' 's|^    - assets/$|    - assets/\
              - shorebird.yaml|' pubspec.yaml
          sed -i '' 's|^              - shorebird.yaml$|    - shorebird.yaml|' pubspec.yaml
          grep -n 'shorebird.yaml' pubspec.yaml
          $SB pub get
          $SB build ios --release --no-codesign -t integration_test/app_updates_probe.dart
          app=build/ios/iphoneos/Runner.app
          flutter_bin="$app/Frameworks/Flutter.framework/Flutter"
          nm -gU "$flutter_bin" | grep shorebird_ | tee /tmp/diag/ios-updater-symbols.txt
          for symbol in shorebird_current_boot_patch_number shorebird_next_boot_patch_number \
              shorebird_check_for_downloadable_update shorebird_update_with_result \
              shorebird_free_update_result; do
            grep -q "_$symbol\$" /tmp/diag/ios-updater-symbols.txt \
              || { echo "::error::$symbol is not exported"; exit 1; }
          done
          find "$app" -name shorebird.yaml | tee /tmp/diag/ios-shorebird-yaml.txt | grep -q .

      # Can a Shorebird patch be applied on the iOS simulator, which is the
      # only iOS device this runner has? Attempted rather than assumed, and
      # every answer kept in ios-simulator-patch-attempt.txt:
      #  1. a release build for the simulator, which is the only mode whose
      #     engine starts the updater;
      #  2. the updater symbols in the simulator engine Shorebird ships, in
      #     debug, the mode the simulator does run;
      #  3. that debug build launched on a booted simulator, with what
      #     DV.Updates reports when it binds the updater;
      #  4. dartvel updates release --patch-source for iOS.
      - name: A patch on the iOS simulator, attempted
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # Every attempt runs and is recorded whatever the one before it did:
          # the runner starts this shell with -e.
          set +e -uo pipefail
          out=/tmp/diag/ios-simulator-patch-attempt.txt
          export FLUTTER_STORAGE_BASE_URL=https://download.shorebird.dev
          SB=/tmp/sbflutter/bin/flutter
          probe=integration_test/app_updates_probe.dart
          cd examples/dartvel_example

          echo "== 1. $SB build ios --simulator --release" | tee -a "$out"
          $SB build ios --simulator --release --no-codesign -t "$probe" > /tmp/diag/ios-sim-release.log 2>&1
          echo "exit $?" | tee -a "$out"
          tail -n 15 /tmp/diag/ios-sim-release.log | tee -a "$out"

          echo "== 2. $SB build ios --simulator --debug, updater symbols" | tee -a "$out"
          $SB build ios --simulator --debug --no-codesign -t "$probe" > /tmp/diag/ios-sim-debug.log 2>&1
          echo "exit $?" | tee -a "$out"
          tail -n 5 /tmp/diag/ios-sim-debug.log | tee -a "$out"
          app=build/ios/iphonesimulator/Runner.app
          if [ -d "$app" ]; then
            nm -gU "$app/Frameworks/Flutter.framework/Flutter" 2>&1 | grep -c shorebird_ \
              | sed 's/^/shorebird_ symbols exported: /' | tee -a "$out"
          fi

          echo "== 3. launched on a simulator" | tee -a "$out"
          udid=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -oE '[0-9A-F-]{36}')
          echo "simulator $udid" | tee -a "$out"
          if [ -n "$udid" ] && [ -d "$app" ]; then
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b || true
            xcrun simctl install "$udid" "$app"
            bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
            ( xcrun simctl launch --console-pty "$udid" "$bundle" > /tmp/diag/ios-sim-console.log 2>&1 & )
            for i in $(seq 1 60); do
              grep -q 'OTA-PROBE' /tmp/diag/ios-sim-console.log 2>/dev/null && break
              sleep 2
            done
            sleep 5
            grep 'OTA-PROBE' /tmp/diag/ios-sim-console.log | tee -a "$out" \
              || { echo "no OTA-PROBE line; console tail:"; tail -n 20 /tmp/diag/ios-sim-console.log; } | tee -a "$out"
            xcrun simctl terminate "$udid" "$bundle" || true
          fi

          echo "== 4. dartvel updates release --platform ios --patch-source" | tee -a "$out"
          dart run dartvel_cli:dartvel updates release --platform ios \
            --patch-source https://updates.example.invalid/updates 2>&1 | tail -n 3 | tee -a "$out"

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ota-updates-ios, path: /tmp/diag/, if-no-files-found: warn }

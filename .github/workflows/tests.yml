name: Tests

# Runs the analyzer and every Dart and Flutter test suite.
#
# This did not exist. The Rust crate and the spec-status index were checked on
# every push, and the 1,100-odd Dart tests were not checked at all — they ran
# only when someone remembered to run them locally. A green commit therefore
# meant nothing had been checked, which is worse than no signal, because it
# looks like one.
#
# Per package rather than one job, so a failure names which package broke
# instead of which command did, and so a slow suite does not delay the others.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.5

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    # A suite that takes this long has stopped making progress. The whole set
    # runs in well under two minutes locally.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: dartvel_core, runner: dart }
          - { package: dartvel_cli, runner: dart }
          - { package: dartvel_shelf, runner: dart }
          - { package: dartvel_generator, runner: dart }
          - { package: dartvel_flutter, runner: flutter }
          # dartvel_dev, not dartvel. The package was renamed when the name
          # was taken on pub.dev and this matrix was not, so the job has been
          # failing on a working directory that does not exist ever since --
          # bash cannot start, which reads as an infrastructure fault rather
          # than a stale name.
          - { package: dartvel_dev, runner: flutter }
          # Added with the package. A new package whose suite CI never runs is
          # the same "green means nothing was checked" problem this workflow
          # was written to fix.
          - { package: dartvel_windowing, runner: flutter }

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # dartvel_shelf's native-asset build hook compiles the Rust runtime and
      # runs cbindgen over it, and that hook runs during `dart test` for
      # anything depending on it. A missing cbindgen is a hard error there,
      # unlike a missing cargo, so it has to be installed rather than assumed.
      - name: Cache cbindgen
        id: cbindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ runner.os }}-${{ runner.arch }}

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --locked

      # Keyed on the Rust sources, so a hit is a build of the same crate.
      - name: Cache the Rust runtime build
        uses: actions/cache@v4
        with:
          path: |
            packages/dartvel_shelf/rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            tests-shelf-${{ runner.os }}-${{
            hashFiles('packages/dartvel_shelf/rust/Cargo.toml',
                      'packages/dartvel_shelf/rust/Cargo.lock',
                      'packages/dartvel_shelf/rust/src/**') }}
          restore-keys: tests-shelf-${{ runner.os }}-

      - name: Resolve dependencies
        working-directory: packages/${{ matrix.package }}
        run: ${{ matrix.runner }} pub get

      # Analyzer failures are build failures. Infos are not: this repository
      # carries a handful of pre-existing directive-ordering and close-sinks
      # infos, and failing on those would mean the gate is switched off on its
      # first day, which is how a gate stops being read.
      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: ${{ matrix.runner }} analyze --fatal-warnings lib test

      # Under an X server for the Flutter packages. The Linux native bindings
      # -- clipboard, window, and the global-shortcut grab -- skip themselves
      # when there is no DISPLAY, so `flutter test` alone was reporting those
      # suites as passing while never running a line of them. Xvfb makes the
      # skip guard false; libXtst is what the shortcut suite presses keys with.
      - name: Headless display for the native binding suites
        if: matrix.runner == 'flutter'
        run: |
          sudo apt-get update -qq
          # dbus-x11 for a session bus and dunst to answer on it: the tray is
          # a StatusNotifierItem and a notification is a D-Bus call, so both
          # suites skipped themselves under `flutter test` alone -- passing
          # while never running a line.
          sudo apt-get install -y -qq xvfb libxtst6 libgtk-3-0 poppler-utils dbus-x11 dunst

      # A Secret Service for the application-key store. The libsecret store
      # skips itself when nothing answers org.freedesktop.secrets, so `dart
      # test` alone would pass without storing a single key; a private session
      # bus with an unlocked GNOME keyring makes the skip guard false. The
      # password is the keyring's, on a runner that is discarded afterwards.
      - name: Secret Service for the key-store suite
        if: matrix.package == 'dartvel_core'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus-x11 libsecret-1-0

      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: |
          if [ "${{ matrix.runner }}" = "flutter" ]; then
            # A display and a session bus: the tray exports a
            # StatusNotifierItem and the notification binding calls the
            # daemon, and both skip themselves without one.
            xvfb-run -a dbus-run-session -- bash -c 'dunst >/dev/null 2>&1 & sleep 1; flutter test'
          elif [ "${{ matrix.package }}" = "dartvel_core" ]; then
            dbus-run-session -- bash -c 'eval "$(echo -n ci-keyring | gnome-keyring-daemon --unlock --components=secrets)"; sleep 1; dart test'
          else
            dart test
          fi

  # The only test in this repository that runs the application rather than a
  # widget in isolation. It exists because unit tests on one platform cannot
  # catch a build that produces an artifact which does not start: four of the
  # seven Windows bugs corrupted generated output on every platform and passed
  # 1,101 tests for months, because nothing ever launched the result.
  #
  # Linux is the only target that can run headless in CI today. The others need
  # emulators or hardware and are tracked separately.
  integration:
    name: integration (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop and headless display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgtk-3-dev clang cmake \
            pkg-config xvfb

      - name: Cache cbindgen
        id: cbindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: cbindgen-${{ runner.os }}-${{ runner.arch }}

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --locked

      - name: Cache the Rust runtime build
        uses: actions/cache@v4
        with:
          path: |
            packages/dartvel_shelf/rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            tests-shelf-${{ runner.os }}-${{
            hashFiles('packages/dartvel_shelf/rust/Cargo.toml',
                      'packages/dartvel_shelf/rust/Cargo.lock',
                      'packages/dartvel_shelf/rust/src/**') }}
          restore-keys: tests-shelf-${{ runner.os }}-

      - name: Resolve dependencies
        working-directory: examples/dartvel_example
        run: flutter pub get

      # Generated output is not committed — examples/dartvel_example/.gitignore
      # excludes lib/dartvel_client/ — so a fresh checkout has no client at all
      # and the app cannot compile until it is generated. That makes this job an
      # end-to-end check of the generator itself: if generation emits something
      # that does not compile or does not wire up, the app fails to start here
      # rather than in someone's clone.
      - name: Generate the Dartvel client
        working-directory: examples/dartvel_example
        run: dart run dartvel_cli:dartvel routes

      # A real window server, because the app is a desktop binary and a
      # headless runner has no display. This is the same arrangement that first
      # proved the Linux target runs rather than merely builds.
      - name: Run the app and assert it starts
        working-directory: examples/dartvel_example
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 3
          export DISPLAY=:99

          # One file per invocation. `flutter test integration_test` runs them
          # in a single run and each one launches the application, so the
          # second start lands while the first is still holding the display
          # and fails with "the log reader stopped unexpectedly, or never
          # started" -- which reads as a broken app rather than two of them.
          for suite in integration_test/*_test.dart; do
            echo "=== $suite"
            flutter test "$suite" -d linux
          done

  # The SDK floor is one number across every package, and nothing enforced
  # that. All eight declared >=3.4.0 while dartvel_mix required 3.12, so the
  # error a user on an old Dart actually got named a transitive package rather
  # than their Dart version.
  #
  # This needs every package resolved, because it reads the real floor out of
  # each package's resolved dependency graph rather than trusting a number
  # written here — a hard-coded version in the check would sleep through the
  # one event that matters, a dependency raising its own floor.
  sdk-floor:
    name: sdk floor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve every package
        run: |
          set -e
          for dir in packages/*/ examples/*/ .; do
            [ -f "$dir/pubspec.yaml" ] || continue
            echo "::group::$dir"
            (cd "$dir" && flutter pub get)
            echo "::endgroup::"
          done

      - name: Check the declared floors
        run: dart test test/unit/sdk_floor_test.dart

  # The browser bindings run in a browser, or they are untested. The VM suite
  # resolves the stub, so it proves what web claims and nothing about whether
  # any of it works — screen.geometry returning a fabricated size passes there
  # and fails here.
  browser:
    name: browser bindings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Chrome without a sandbox
        run: |
          # A container cannot use Chrome's sandbox, and without this the test
          # runner hangs until it is killed rather than reporting anything.
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox --disable-dev-shm-usage --disable-gpu "$@"\n' \
            | sudo tee /usr/local/bin/chrome-nosandbox > /dev/null
          sudo chmod +x /usr/local/bin/chrome-nosandbox

      - name: Resolve dependencies
        working-directory: packages/dartvel_flutter
        run: flutter pub get

      - name: Run the browser suite
        working-directory: packages/dartvel_flutter
        env:
          CHROME_EXECUTABLE: /usr/local/bin/chrome-nosandbox
        run: flutter test --platform chrome test/web_bindings_browser_test.dart test/webcrypto_key_store_test.dart

  # The Win32 bindings can only be exercised on Windows, and the clipboard is
  # the reason it is worth a runner: its global-memory ownership rules mean a
  # mistake produces a use-after-free or an empty paste, not a compile error.
  windows-bindings:
    name: windows bindings
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/dartvel_flutter
        run: flutter pub get

      - name: Run the Win32 suite
        working-directory: packages/dartvel_flutter
        run: flutter test test/windows_bindings_live_test.dart
      # window.displays through EnumDisplayMonitors, against the runner's own
      # desktop session: at least one display, a primary, a real size.
      - name: Display enumeration
        working-directory: packages/dartvel_windowing
        run: |
          flutter pub get
          flutter test test/displays_live_test.dart
      # The application key sealed with DPAPI: the store the spec's table
      # names for Windows, exercised on Windows rather than skipped.
      - name: The DPAPI key store
        working-directory: packages/dartvel_core
        run: |
          dart pub get
          dart test test/app_key_store_test.dart
      # The single-instance lock between two real processes. It is what a
      # second launch of a desktop application meets, and file locking is
      # the part of it that differs most between operating systems -- so
      # running it only on Linux proved it only there.
      - name: The single-instance lock, between processes
        working-directory: packages/dartvel_core
        run: dart test test/single_instance_process_test.dart

  # The Objective-C bindings can only be exercised on macOS. A mistyped message
  # signature does not fail to compile — it corrupts the stack or returns
  # rubbish — so this is the only place the clipboard path is actually checked.
  #
  # The repository is public, so macOS minutes are free and unlimited. This
  # runs one small suite because that is all there is to run here — the rest of
  # the package is host-independent and already covered by the ubuntu matrix,
  # not because a macOS job is expensive.
  apple-bindings:
    name: macos bindings
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: packages/dartvel_flutter
        run: flutter pub get

      # The suite reports every test passing and `flutter test` still exits
      # 1, which means the tester process died on its way out rather than a
      # test failing -- an AppKit exception raised after the reporter has
      # already printed its summary. There is no macOS to reproduce that on
      # outside this runner, so the suite is run in parts and each part's
      # exit code printed: a part that exits 1 with everything green names
      # the group whose teardown is killing the process.
      - name: Run the macOS suite
        working-directory: packages/dartvel_flutter
        run: |
          set +e
          flutter test test/macos_bindings_live_test.dart --plain-name dialogs
          dialogs=$?
          flutter test test/macos_bindings_live_test.dart --plain-name 'drag and drop'
          dnd=$?
          flutter test test/macos_bindings_live_test.dart
          whole=$?
          echo "exit codes -- dialogs: $dialogs, drag and drop: $dnd, whole suite: $whole"
          [ "$whole" -eq 0 ]
      # window.displays through CGGetActiveDisplayList, against the runner's
      # own display: at least one, a main, a real size in points.
      - name: Display enumeration
        working-directory: packages/dartvel_windowing
        run: |
          flutter pub get
          flutter test test/displays_live_test.dart
      # The application key in the Keychain: the store the spec's table names
      # for macOS, exercised on macOS rather than skipped.
      - name: The Keychain key store
        working-directory: packages/dartvel_core
        run: |
          dart pub get
          dart test test/app_key_store_test.dart
      # The single-instance lock between two real processes; see the Windows
      # job for why it is not enough to run it on one operating system.
      - name: The single-instance lock, between processes
        working-directory: packages/dartvel_core
        run: dart test test/single_instance_process_test.dart

  # The site is a Flutter application like any other, and nothing analysed
  # it: a syntax error in it reached CI as a failed *runtime* job twenty
  # minutes in, having built the whole world first. This is the same fault in
  # two minutes.
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: sites/dartvel_site
        run: flutter pub get
      - name: Analyze
        working-directory: sites/dartvel_site
        run: flutter analyze lib

  spec:
    name: spec-status index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      # Deliberately not path-filtered here. The index cites evidence that
      # lives under packages/, so deleting a test file can invalidate it — and
      # that is exactly what happened: renaming computed_test.dart left a
      # dangling citation that no push-triggered job was watching for.
      - run: dart run tool/spec_status_check.dart

# dartvel.dev, built, checked and packaged on a runner.
#
# The site zip used to be built, staged and photographed on the development
# machine, which is a 32 GB disk that fills. Everything heavy happens here
# instead, and what comes back is the finished zip and small contact sheets:
#
#   dartvel-site        the zip to upload, and its SHA-256
#   dartvel-site-shots  every sitemap page at 1440x900 and 390x844, and one
#                       contact sheet per few pages for a person to look at
#
# A build from main whose every page painted is also published to GitHub
# Pages, at https://danroyal001.github.io/dartvel_dev/, so the current site
# can be opened from a link rather than unzipped. Pages serves it under
# /dartvel_dev/, so that copy's base href and root-relative links are
# rewritten to that prefix; the zip keeps "/" for dartvel.dev.
#
# The staged tree gets 755 directories and 644 files before it is zipped:
# a tree zipped from /tmp carried 756 and a shared host refused to serve it.
# A page that paints nothing -- one flat colour -- fails the run, because a
# blank canvas and a missing route both look like a screenshot.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'sites/dartvel_site/**'
      - 'packages/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: build, photograph every page, package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.5', channel: stable, cache: true }

      - name: Install capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick zip

      - name: Build the site
        working-directory: sites/dartvel_site
        run: |
          set -euo pipefail
          flutter pub get
          dart run dartvel_cli:dartvel build web

      - name: Stage with the modes a shared host serves
        run: |
          set -euo pipefail
          SHORT=$(git rev-parse --short=8 HEAD)
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          mkdir -p /tmp/out
          cp -r sites/dartvel_site/build/web /tmp/stage
          rm -f /tmp/stage/.last_build_id
          find /tmp/stage -type d -exec chmod 755 {} +
          find /tmp/stage -type f -exec chmod 644 {} +
          bad=$(find /tmp/stage \( -type d ! -perm 755 \) -o \( -type f ! -perm 644 \) | head -5)
          if [ -n "$bad" ]; then echo "::error::wrong modes: $bad"; exit 1; fi
          (cd /tmp/stage && zip -qrX "/tmp/out/dartvel_site-web-$SHORT.zip" .)
          (cd /tmp/out && sha256sum "dartvel_site-web-$SHORT.zip" > "dartvel_site-web-$SHORT.zip.sha256")
          cat /tmp/out/*.sha256

      # A page that renders in a browser and carries only a scroll button in
      # its fallback is not indexed for what it is about. The site shipped
      # that way on every page for weeks, and nothing said so: the pictures
      # were right, the meta description was right, and the body a crawler
      # reads held six words.
      - name: Every page says something to a crawler
        run: dart "$GITHUB_WORKSPACE/tool/ci/crawler_text_check.dart" /tmp/stage

      - uses: actions/upload-artifact@v7
        with:
          name: dartvel-site
          path: /tmp/out/
          retention-days: 30

      # <base href="/"> and href="/docs" both point at the domain's root,
      # which on Pages is someone else's. One pattern covers both, so the base
      # tag is not rewritten twice.
      - name: Stage the Pages copy under /dartvel_dev/
        run: |
          set -euo pipefail
          cp -r /tmp/stage /tmp/pages
          find /tmp/pages -name '*.html' -exec \
            sed -i -E 's#(href|src)="/([^/"]|")#\1="/dartvel_dev/\2#g' {} +
          grep -q '<base href="/dartvel_dev/">' /tmp/pages/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: /tmp/pages

      # dartvel capture pages waits for each page to show text before it
      # photographs it. Chrome's own --screenshot fires when its virtual time
      # runs out, and caught the home, features and studio pages with their
      # backgrounds drawn and their text not yet painted.
      - name: Photograph every page in the sitemap
        working-directory: sites/dartvel_site
        run: |
          set -euo pipefail
          dart run dartvel_cli:dartvel capture pages --web /tmp/stage --out /tmp/shots \
            --sizes 1440x900,390x844 --chrome "$(command -v google-chrome)"
          grep -o '<loc>[^<]*</loc>' /tmp/stage/sitemap.xml > /tmp/shots/routes.txt

      - name: Every page painted something
        run: |
          set -uo pipefail
          expected=$(( $(wc -l < /tmp/shots/routes.txt) * 2 ))
          got=$(ls /tmp/shots/*.png | wc -l)
          failed=0
          if [ "$got" -ne "$expected" ]; then
            echo "::error::$got screenshots for $expected page views"; failed=1
          fi
          for shot in /tmp/shots/*.png; do
            # One flat colour is a page that never drew.
            spread=$(convert "$shot" -colorspace Gray -format '%[fx:standard_deviation]' info:)
            if awk "BEGIN { exit !($spread < 0.01) }"; then
              echo "::error::$(basename "$shot") is blank ($spread)"; failed=1
            fi
          done
          # And a page that drew its shell and not its article, which the
          # check above passes because a sidebar is not one flat colour. Two
          # routes with identical bytes did not both render.
          dart "$GITHUB_WORKSPACE/tool/ci/shot_duplicates.dart" /tmp/shots || failed=1
          exit $failed

      - name: Contact sheets for a person to look at
        if: always()
        run: |
          set -uo pipefail
          mkdir -p /tmp/shots/sheets
          cd /tmp/shots
          ls *-1440x900.png 2>/dev/null | split -l 4 -d -a 2 - sheets/d_ || true
          ls *-390x844.png 2>/dev/null | split -l 8 -d -a 2 - sheets/m_ || true
          for list in sheets/d_??; do
            [ -e "$list" ] || continue
            montage -label '%t' $(cat "$list") -tile 2x2 -geometry 720x450+4+4 -pointsize 14 "$list.png"
          done
          for list in sheets/m_??; do
            [ -e "$list" ] || continue
            montage -label '%t' $(cat "$list") -tile 8x1 -geometry 195x422+3+3 -pointsize 11 "$list.png"
          done
          rm -f sheets/d_?? sheets/m_??
          ls sheets | wc -l

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dartvel-site-shots
          path: /tmp/shots/
          retention-days: 14

  pages:
    name: publish to GitHub Pages
    needs: site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

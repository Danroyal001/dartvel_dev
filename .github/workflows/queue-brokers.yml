# The queue adapters against the real brokers.
#
# Every adapter here is tested against a fake that returns what the protocol
# says it should. That proves the adapter speaks the protocol it was written
# against; it proves nothing about whether the broker agrees. A fake that
# shares the author's misunderstanding passes every time.
#
# So each adapter also runs against the actual server in a service container:
# RabbitMQ's own image, and ElasticMQ for SQS, which implements the SQS API.
name: queue brokers

on:
  push:
    paths:
      - 'packages/dartvel_core/lib/src/queues/**'
      - 'packages/dartvel_core/test/*queue*'
      - '.github/workflows/queue-brokers.yml'
  workflow_dispatch:

jobs:
  rabbitmq:
    name: RabbitMQ — publish, consume, acknowledge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        # Without this the job races the broker: the container is "started"
        # long before AMQP is accepting connections.
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }

      - name: Resolve
        working-directory: packages/dartvel_core
        run: dart pub get

      - name: The broker is actually up
        run: |
          set -euo pipefail
          # The health check gates the job, not the protocol. Ask the
          # management API so a failure here names the broker rather than
          # appearing later as a confusing adapter error.
          for i in $(seq 1 30); do
            if curl -sf -u guest:guest http://localhost:15672/api/overview \
                 > /tmp/overview.json; then
              dart tool/ci/say_json.dart /tmp/overview.json \
                'RabbitMQ' rabbitmq_version 'on' node
              exit 0
            fi
            sleep 2
          done
          echo "::error::RabbitMQ never answered its management API"
          exit 1

      - name: Round-trip a job through it
        working-directory: packages/dartvel_core
        env:
          DARTVEL_AMQP_HOST: localhost
          DARTVEL_AMQP_PORT: '5672'
        # Bounded: the previous run spent twelve minutes inside a handshake
        # that was never going to be answered and reported nothing useful.
        run: timeout 240 dart test test/amqp_live_test.dart --reporter expanded

  sqs:
    name: SQS — send, receive, delete
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # ElasticMQ implements the SQS API, so the adapter is talking to
      # something that enforces the same rules rather than to a fake that
      # agrees with it.
      sqs:
        image: softwaremill/elasticmq-native:latest
        ports:
          - 9324:9324

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }

      - name: Resolve
        working-directory: packages/dartvel_core
        run: dart pub get

      - name: The queue service is up
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:9324/?Action=ListQueues" > /dev/null; then
              echo "ElasticMQ answering on 9324"
              exit 0
            fi
            sleep 2
          done
          echo "::error::ElasticMQ never answered"
          exit 1

      - name: Round-trip a job through it
        working-directory: packages/dartvel_core
        env:
          DARTVEL_SQS_ENDPOINT: http://localhost:9324
        run: timeout 240 dart test test/sqs_live_test.dart --reporter expanded

  pubsub:
    name: Pub/Sub — publish, pull, acknowledge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Google's own emulator. It starts empty, so the suite creates its topic
      # and subscription rather than assuming a fixture.
      pubsub:
        image: messagebird/gcloud-pubsub-emulator:latest
        ports:
          - 8681:8681

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }

      - name: Resolve
        working-directory: packages/dartvel_core
        run: dart pub get

      - name: The emulator is up
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8681/v1/projects/probe/topics" \
                 > /dev/null; then
              echo "Pub/Sub emulator answering on 8681"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the Pub/Sub emulator never answered"
          exit 1

      - name: Round-trip a job through it
        working-directory: packages/dartvel_core
        env:
          DARTVEL_PUBSUB_ENDPOINT: http://localhost:8681
        run: timeout 240 dart test test/pubsub_live_test.dart --reporter expanded

  kafka:
    name: Kafka — produce, fetch, commit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # Apache's own image in KRaft mode, so there is no ZooKeeper to wait for.
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
            CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          # The suite names a fresh topic per run and relies on this.
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
          KAFKA_CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }

      - name: Resolve
        working-directory: packages/dartvel_core
        run: dart pub get

      - name: The broker is accepting connections
        run: |
          set -euo pipefail
          # A TCP check, because Kafka has no HTTP endpoint to ask.
          for i in $(seq 1 45); do
            if timeout 2 bash -c '</dev/tcp/localhost/9092' 2>/dev/null; then
              echo "Kafka accepting on 9092"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Kafka never accepted a connection on 9092"
          exit 1

      - name: Round-trip a job through it
        working-directory: packages/dartvel_core
        env:
          DARTVEL_KAFKA_HOST: localhost
          DARTVEL_KAFKA_PORT: '9092'
        run: timeout 300 dart test test/kafka_live_test.dart --reporter expanded

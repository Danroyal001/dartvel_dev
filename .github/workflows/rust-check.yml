name: Rust runtime

# Compiles and tests both Rust crates.
#
# There are two since the client moved: dartvel_core/rust builds the outbound
# HTTP client (`dv_http_*`), dartvel_shelf/rust builds the Axum server
# (`aw_*`). They are checked separately because that separation is the point --
# a dependency creeping from one into the other is what this catches.
#
# This exists because the development environment for this project has no
# cargo and not enough disk for a target directory, so CI is where the Rust
# code is actually checked. It runs on push rather than on demand: a compile
# error found four commits later is much more expensive than one found now.

on:
  push:
    paths:
      - 'packages/dartvel_shelf/rust/**'
      - 'packages/dartvel_core/rust/**'
      - '.github/workflows/rust-check.yml'
  pull_request:
    paths:
      - 'packages/dartvel_shelf/rust/**'
      - 'packages/dartvel_core/rust/**'
  workflow_dispatch:

concurrency:
  # A push that supersedes an in-flight check makes the older run irrelevant.
  group: rust-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.crate }} — check, clippy, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: dartvel_core, dir: packages/dartvel_core/rust }
          - { crate: dartvel_shelf, dir: packages/dartvel_shelf/rust }
    # A clean build of this crate is minutes, not tens of minutes. Anything
    # approaching this is stuck rather than slow.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt
          rustup default stable
          rustc --version && cargo --version

      # Keyed on the manifest and lockfile so a hit is the same dependency
      # graph. Sources are deliberately not in the key: a source edit should
      # reuse the dependency build rather than discard it, which is most of
      # the time.
      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.dir }}/target
          key: >-
            rust-check-${{ runner.os }}-${{ matrix.crate }}-${{
            hashFiles(format('{0}/Cargo.toml', matrix.dir),
                      format('{0}/Cargo.lock', matrix.dir)) }}
          restore-keys: rust-check-${{ runner.os }}-${{ matrix.crate }}-

      # The crate's build script runs cbindgen, which is not on a runner.
      - name: Install cbindgen
        run: cargo install cbindgen --locked || true

      # aws-lc-rs is rustls's default provider and we use ring. It compiles a
      # large C codebase for nothing, and on macOS it fails outright: cc-rs
      # invokes clang without an -isysroot and cannot find stdlib.h, which is
      # what broke `dartvel build macos`. Keep it out.
      - name: no second crypto provider
        run: |
          if cargo tree -i aws-lc-rs -e normal >/dev/null 2>&1; then
            echo "::error::aws-lc-rs is back in the dependency tree."
            cargo tree -i aws-lc-rs -e normal
            exit 1
          fi
          echo "aws-lc-rs absent, ring is the only provider"

      - name: cargo check
        run: cargo check --all-targets

      # Warnings are failures here. The FFI surface is unsafe by nature, and
      # the lints that matter most on it are the ones easiest to wave through.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # Advisory rather than blocking. There is no cargo in the environment this
      # code is written in, so a formatting gate would fail every hand-written
      # commit for reasons that are never the bug worth finding.
      - name: cargo fmt
        continue-on-error: true
        run: cargo fmt --check

      # The split is the reason these are two crates. A server symbol in the
      # client library, or the reverse, means they were merged back by
      # accident -- and the frontend is linking a server again.
      - name: the crates stayed separate
        run: |
          set -euo pipefail
          cargo build --release
          lib=$(find target/release -maxdepth 1 -name 'lib*.so' -print -quit)
          echo "inspecting $lib"
          server=$(nm -D "$lib" | grep -c ' T aw_' || true)
          client=$(nm -D "$lib" | grep -c ' T dv_http_' || true)
          echo "aw_*=$server dv_http_*=$client"
          case "${{ matrix.crate }}" in
            dartvel_core)
              if [ "$server" != "0" ]; then
                echo "::error::the client library exports $server server symbols"
                exit 1
              fi
              if [ "$client" = "0" ]; then
                echo "::error::the client library exports no client symbols"
                exit 1
              fi ;;
            dartvel_shelf)
              if [ "$client" != "0" ]; then
                echo "::error::the server library exports $client client symbols"
                exit 1
              fi
              if [ "$server" = "0" ]; then
                echo "::error::the server library exports no server symbols"
                exit 1
              fi ;;
          esac

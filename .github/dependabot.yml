# Version updates, so a pinned package is not left where it was.
#
# This is the half that proposes upgrades. The half that says an upgrade is
# urgent is .github/workflows/dependencies.yml, which asks OSV weekly about
# every version this repository pins and fails when something is reported
# against one.
#
# Grouped and monthly on purpose: a repository that opens twelve pull requests
# a week trains everyone to close them unread, and the advisory check is what
# makes the urgent ones arrive separately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Pub, for the packages that are published. The examples and the sites
  # resolve against the packages beside them, so an update there would be
  # noise about a version nobody installs.
  - package-ecosystem: pub
    directories:
      - /packages/dartvel_core
      - /packages/dartvel_cli
      - /packages/dartvel_flutter
      - /packages/dartvel_shelf
      - /packages/dartvel_dev
      - /packages/dartvel_generator
      - /packages/dartvel_windowing
    schedule:
      interval: monthly
    groups:
      pub:
        patterns: ['*']

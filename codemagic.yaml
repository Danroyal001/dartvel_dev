workflows:
  cli-release-macos-arm64:
    name: CLI Release - macOS ARM64
    instance_type: mac_mini_m1
    max_build_duration: 45
    triggering:
      events:
        - tag
      tag_patterns:
        - 'v*'
    environment:
      vars:
        DART_SDK_VERSION: "3.13.4"
    scripts:
      - name: Setup Dart SDK 3.13.4
        script: |
          set -euo pipefail
          if [ -d "$HOME/.dart_sdk" ]; then rm -rf "$HOME/.dart_sdk"; fi
          curl -LO https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.4/sdk/dartsdk-macos-arm64-release.zip
          unzip -q dartsdk-macos-arm64-release.zip -d "$HOME"
          export PATH="$HOME/dart-sdk/bin:$PATH"
          echo "PATH=$PATH" >> $CM_ENV
          dart --version
      - name: Setup Rust stable
        script: |
          rustup install stable || rustc --version || cargo --version || echo "Rust toolchain present"
      - name: Build the CLI executable
        script: |
          set -euo pipefail
          cd packages/dartvel_cli
          dart pub get
          dart build cli --target bin/dartvel.dart
      - name: Locate and stage binary
        script: |
          set -euo pipefail
          mkdir -p artifacts
          BUILT=$(find packages/dartvel_cli/build/cli -type f \( -name dartvel -o -name dartvel.exe \) | head -1)
          if [ -z "$BUILT" ]; then
            echo "::error::dart build produced no executable"
            find packages/dartvel_cli/build -maxdepth 4 || true
            exit 1
          fi
          cp "$BUILT" artifacts/dartvel-macos-arm64
          chmod +x artifacts/dartvel-macos-arm64 || true
          ls -lh artifacts/
      - name: Verify binary runs and reports version
        script: |
          set -euo pipefail
          OUT=$(./artifacts/dartvel-macos-arm64 --version 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -qi "Dartvel CLI" || {
            echo "::error::the binary did not report a version"
            exit 1
          }
      - name: Verify architecture (file check)
        script: |
          set -euo pipefail
          if command -v file >/dev/null 2>&1; then
            DESC=$(file -b artifacts/dartvel-macos-arm64)
            echo "$DESC"
            echo "$DESC" | grep -q "arm64" || { echo "::error::expected arm64, got: $DESC"; exit 1; }
          fi
    artifacts:
      - artifacts/dartvel-macos-arm64
    publishing:
      email:
        recipients:
          - dev@dartvel.dev

  cli-release-macos-x64:
    name: CLI Release - macOS x64
    instance_type: mac_mini_m1
    max_build_duration: 45
    triggering:
      events:
        - tag
      tag_patterns:
        - 'v*'
    environment:
      vars:
        DART_SDK_VERSION: "3.13.4"
    scripts:
      - name: Setup Dart SDK 3.13.4
        script: |
          set -euo pipefail
          if [ -d "$HOME/.dart_sdk" ]; then rm -rf "$HOME/.dart_sdk"; fi
          curl -LO https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.4/sdk/dartsdk-macos-arm64-release.zip
          unzip -q dartsdk-macos-arm64-release.zip -d "$HOME"
          export PATH="$HOME/dart-sdk/bin:$PATH"
          echo "PATH=$PATH" >> $CM_ENV
          dart --version
      - name: Setup Rust stable
        script: |
          rustup install stable || rustc --version || echo "Rust toolchain present"
      - name: Build the CLI executable (x64)
        script: |
          set -euo pipefail
          cd packages/dartvel_cli
          dart pub get
          dart build cli --target bin/dartvel.dart --target-arch x64
      - name: Locate and stage binary
        script: |
          set -euo pipefail
          mkdir -p artifacts
          BUILT=$(find packages/dartvel_cli/build/cli -type f \( -name dartvel -o -name dartvel.exe \) | head -1)
          if [ -z "$BUILT" ]; then
            echo "::error::dart build produced no executable"
            find packages/dartvel_cli/build -maxdepth 4 || true
            exit 1
          fi
          cp "$BUILT" artifacts/dartvel-macos-x64
          chmod +x artifacts/dartvel-macos-x64 || true
          ls -lh artifacts/
      - name: Verify binary runs and reports version
        script: |
          set -euo pipefail
          OUT=$(./artifacts/dartvel-macos-x64 --version 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -qi "Dartvel CLI" || {
            echo "::error::the binary did not report a version"
            exit 1
          }
      - name: Verify architecture (file check)
        script: |
          set -euo pipefail
          if command -v file >/dev/null 2>&1; then
            DESC=$(file -b artifacts/dartvel-macos-x64)
            echo "$DESC"
            echo "$DESC" | grep -q "x86_64" || { echo "::error::expected x86_64, got: $DESC"; exit 1; }
          fi
    artifacts:
      - artifacts/dartvel-macos-x64
    publishing:
      email:
        recipients:
          - dev@dartvel.dev

  cli-release-windows-x64:
    name: CLI Release - Windows x64
    instance_type: windows_x2
    max_build_duration: 45
    triggering:
      events:
        - tag
      tag_patterns:
        - 'v*'
    environment:
      vars:
        DART_SDK_VERSION: "3.13.4"
    scripts:
      - name: Setup Dart SDK 3.13.4
        script: |
          $dartUrl = "https://storage.googleapis.com/dart-archive/channels/stable/release/3.13.4/sdk/dartsdk-windows-x64-release.zip"
          Invoke-WebRequest -Uri $dartUrl -OutFile dartsdk-windows-x64-release.zip
          Expand-Archive -Path dartsdk-windows-x64-release.zip -DestinationPath C:\dart-sdk -Force
          $env:PATH = "C:\dart-sdk\dart-sdk\bin;" + $env:PATH
          echo "PATH updated"
      - name: Setup Rust stable
        script: |
          rustc --version || cargo --version || echo "Rust toolchain present"
      - name: Build the CLI executable
        script: |
          set -euo pipefail
          cd packages/dartvel_cli
          dart pub get
          dart build cli --target bin/dartvel.dart
      - name: Locate and stage binary
        script: |
          $BUILT = (Get-ChildItem -Path packages/dartvel_cli/build/cli -Recurse -Filter dartvel.exe | Select-Object -First 1).FullName
          if (-not $BUILT) {
            Write-Error "dart build produced no executable"
            Get-ChildItem -Path packages/dartvel_cli/build -Recurse -Depth 4 | Format-List
            exit 1
          }
          New-Item -ItemType Directory -Force -Path artifacts > $null
          Copy-Item $BUILT artifacts/dartvel-windows-x64.exe
          Get-ChildItem artifacts/
      - name: Verify binary runs and reports version
        script: |
          $OUT = & .\artifacts\dartvel-windows-x64.exe --version 2>&1 | Out-String
          Write-Host $OUT
          if ($OUT -notmatch "Dartvel CLI") {
            Write-Error "the binary did not report a version"
            exit 1
          }
      - name: Verify architecture
        script: |
          # On Windows, file command may not exist; skip gracefully.
          Write-Host "Windows binary: artifacts/dartvel-windows-x64.exe"
    artifacts:
      - artifacts/dartvel-windows-x64.exe
    publishing:
      email:
        recipients:
          - dev@dartvel.dev
